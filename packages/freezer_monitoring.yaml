# Freezer / Fridge Temperature Monitoring — HA package
# ---------------------------------------------------------------------------
# Deploy: copy to the Green at /config/packages/freezer_monitoring.yaml.
# configuration.yaml already includes:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Sensor map (current 2026-07-18):
#   Garage freezer       = 592TXR "Acurite-Tower" ch B (id 2082) — temp+humidity
#   Garage fridge        = 592TXR "Acurite-Tower" ch A (id 13260) — temp+humidity
#   Kitchen fridge       = 606TX "Acurite-606TX" (id 126) — TEMP ONLY
#   Garage fridge-freezer= 606TX "Acurite-606TX" (id 174) — TEMP ONLY
#   The two 606s SHARE topic Acurite-606TX/1 (no channel switch) — split by `id`
#   in each value_template (see the 606 section below).
#   Outdoor kitchen fridge= Acurite-00276rm monitor (id 5978) + 06011RM PROBE —
#     probe temp in temperature_1_C (inside the box), body/ambient in temperature_C.
#
# 592TXR Towers key on the A/B/C slide switch (STABLE; device id rotates on
# battery change). 606TX has no switch — rtl_433 always tags it channel 1, so it
# publishes to rtl_433/devices/Acurite-606TX/1. Topics never collide.
#
# History note: channel A (592TXR id 13260, has humidity) WAS the kitchen fridge,
# then briefly the outdoor fridge, then parked. On 2026-07-15 it was placed in the
# GARAGE FRIDGE and wired up here. The kitchen fridge runs on the 606 now — the
# 606 couldn't reach from the OUTDOOR kitchen fridge (metal box + distance blocks
# 433MHz, even the stronger Tower went silent sealed inside), but it's rock-solid
# at the indoor kitchen fridge.
#
# Outdoor kitchen fridge: WIRED 2026-07-18 — AcuRite 00276rm monitor + 06011RM
# plug-in probe. rtl_433 decodes it as "Acurite-00276rm" (the earlier "00275rm"
# guess was wrong — verified off the live stream). PROBE temp = temperature_1_C
# (probe on a lead INSIDE the box), body/ambient = temperature_C. This keeps the
# transmitter OUTSIDE the metal box — the only architecture that beats the
# Faraday cage. (The 986 was a WRONG call — its pucks mount inside → same failure
# as the 606.) That spot was marginal even open-air, so it likely still wants
# receiver-side RF help; expire_after is set generous (900s) pending observed
# reception density at the real location.
#
# rtl_433 publishes per-device JSON to rtl_433/devices/<model>/<channel>. Tower
# keys: temperature_C, humidity, battery_ok, channel; 606TX: no humidity.
# expire_after (offline window) is per-sensor. Sniff live stream to debug:
#   ssh ha-green → mosquitto_sub -h core-mosquitto -u rtl433 -P <pw> -t 'rtl_433/devices/#' -v
#   (broker creds live in the mosquitto add-on options via the supervisor API)
#
# NOTE (2026-07-14): the SDR also hears an Acurite-609TXC (id 204) reporting a
# LOW battery — a one-piece temp+humidity sensor (NOT a probe model),
# unidentified/unplaced, intentionally NOT wired here yet.
# ---------------------------------------------------------------------------

mqtt:
  sensor:
    # ==== Garage freezer : channel B ====
    - name: "Garage Freezer Temperature"
      unique_id: frzmon_garage_freezer_temp
      state_topic: "rtl_433/devices/Acurite-Tower/B"
      value_template: >-
        {% if value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600
    - name: "Garage Freezer Humidity"
      unique_id: frzmon_garage_freezer_humidity
      state_topic: "rtl_433/devices/Acurite-Tower/B"
      value_template: "{{ value_json.humidity | int }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      expire_after: 600

    # ==== Garage refrigerator : channel A (592TXR id 13260) ====
    - name: "Garage Fridge Temperature"
      unique_id: frzmon_garage_fridge_temp
      state_topic: "rtl_433/devices/Acurite-Tower/A"
      value_template: >-
        {% if value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600
    - name: "Garage Fridge Humidity"
      unique_id: frzmon_garage_fridge_humidity
      state_topic: "rtl_433/devices/Acurite-Tower/A"
      value_template: "{{ value_json.humidity | int }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      expire_after: 600

    # ==== Two Acurite-606TX share ONE topic — filter by `id` (temp-only) ====
    # The 606TX has NO channel switch, so rtl_433 tags EVERY 606 as channel 1 →
    # both publish to rtl_433/devices/Acurite-606TX/1. They're told apart ONLY by
    # the `id` field in the payload, so each sensor's value_template must gate on
    # its id and return `this.state` for the other unit's messages (else the two
    # readings clobber each other). 606 ids are stable (unlike the Towers, whose
    # ids rotate on battery swap — that's why Towers key on the A/B/C channel).
    #   id 126 = Kitchen fridge (indoor, ~33°F). id 174 = Garage Fridge-Freezer
    #   (the combo garage fridge's FREEZER compartment; distinct from the
    #   standalone chest "Garage Freezer" on Tower/B).
    # Caveat: expire_after resets on ANY 606 message on the shared topic, so
    # per-unit OFFLINE detection is weak — a single 606 dying isn't flagged offline
    # while the other still transmits (low-battery alert still covers battery death;
    # total SDR/reception loss still trips offline for both).
    - name: "Kitchen Fridge Temperature"
      unique_id: frzmon_kitchen_fridge_temp
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 126 and value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600

    # ==== Garage Fridge-Freezer : Acurite-606TX id 174 (temp-only) ====
    - name: "Garage Fridge-Freezer Temperature"
      unique_id: frzmon_garage_fridge_freezer_temp
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 174 and value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600

    # ==== Outdoor kitchen fridge ==== 00276rm 433 MQTT sensors RETIRED
    # 2026-07-23: replaced by a local ESPHome ATOM S3 Lite + DS18B20 probe
    # (native HA API, "Outdoor Kitchen Fridge" @ 192.168.224.22), which now
    # owns sensor.outdoor_kitchen_fridge_temperature. 00276rm = garage spare.

  binary_sensor:
    - name: "Garage Freezer Sensor Battery"
      unique_id: frzmon_garage_freezer_batt
      state_topic: "rtl_433/devices/Acurite-Tower/B"
      value_template: "{{ value_json.battery_ok | int }}"
      payload_on: "0"        # battery_ok = 0 -> low (device_class battery: on = low)
      payload_off: "1"
      device_class: battery
      expire_after: 600
    - name: "Garage Fridge Sensor Battery"
      unique_id: frzmon_garage_fridge_batt
      state_topic: "rtl_433/devices/Acurite-Tower/A"
      value_template: "{{ value_json.battery_ok | int }}"
      payload_on: "0"
      payload_off: "1"
      device_class: battery
      expire_after: 600
    # Two 606s share this topic — gate on id, hold prior state otherwise
    # (this.state is "on"/"off" post-mapping → re-emit as "0"/"1").
    - name: "Kitchen Fridge Sensor Battery"
      unique_id: frzmon_kitchen_fridge_batt
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 126 %}{{ value_json.battery_ok | int }}
        {% else %}{{ '0' if this.state == 'on' else '1' }}{% endif %}
      payload_on: "0"
      payload_off: "1"
      device_class: battery
      expire_after: 600
    - name: "Garage Fridge-Freezer Sensor Battery"
      unique_id: frzmon_garage_fridge_freezer_batt
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 174 %}{{ value_json.battery_ok | int }}
        {% else %}{{ '0' if this.state == 'on' else '1' }}{% endif %}
      payload_on: "0"
      payload_off: "1"
      device_class: battery
      expire_after: 600
    # (Outdoor kitchen fridge battery sensor removed 2026-07-23 — ESPHome unit is USB-powered.)

# ---------------------------------------------------------------------------
# Derived sensors — 3-hour rolling mean of the outdoor kitchen fridge (the
# "software glycol bottle", 2026-07-24). The ESPHome probe reads AIR, so the raw
# reading swings ~11°F with every compressor cycle (33↔44°F, 45-90 min). A 3h mean
# is immune to that cycling by construction and exposes a sustained plateau / slow
# drift that neither the absolute >50°F warn nor the rate detector can see — a
# failure that stalls in the 44-49°F band never crosses 50 and has no lasting
# gradient, yet the air is already past the 40°F USDA line at every cycle peak.
# ---------------------------------------------------------------------------
sensor:
  - platform: statistics
    name: "Outdoor Kitchen Fridge 3h Mean"
    unique_id: frzmon_outdoor_kitchen_fridge_mean_3h
    entity_id: sensor.outdoor_kitchen_fridge_temperature
    state_characteristic: mean
    max_age:
      hours: 3
    sampling_size: 500        # 3h @ 30s ≈ 360 samples; headroom so max_age governs the window
    precision: 1

  # ---- PULL-DOWN FLOOR (2026-07-27) — the specific health signal for an air-probe
  # fridge in swinging ambient. The mean and the peaks mostly track WEATHER; the
  # FLOOR tracks the refrigeration. A healthy unit reaches its trough every cycle no
  # matter how hot it is outside; a failing compressor or a bad seal cannot.
  # Evidence for using 24h and not 3h: measured rolling 3h minima over 07-26/07-27
  # were 34.9 34.9 34.7 34.6 34.9 35.6 38.9 38.8 36.5 33.9 34.1 34.3 34.3 35.9 40.3 42.9
  # — the hot-afternoon troughs climb to 38.9-42.9, so a "3h min > 38" rule (my first
  # proposal) would have FALSE-FIRED on 4 of 16 windows. Over a full 24h the floor is
  # rock solid: daily minima 33.0 / 33.6 / 34.6 / 33.9 across 07-24..07-27, even as
  # daily MAXIMA climbed 48.5 -> 55.4. So >40 for 24h means it genuinely never got
  # cold all day = real failure, and a heat wave alone cannot trip it.
  # Name MUST keep the `_min` suffix: the Guardian panel excludes
  # /_(mean|median|average|avg|min|max|stdev)$/ so derived stats don't duplicate the
  # real probe's tile (the 3h mean did exactly that once).
  - platform: statistics
    name: "Outdoor Kitchen Fridge 24h Min"
    unique_id: frzmon_outdoor_kitchen_fridge_min_24h
    entity_id: sensor.outdoor_kitchen_fridge_temperature
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 3200      # 24h @ 30s ≈ 2880; headroom so max_age governs the window
    precision: 1

# ---------------------------------------------------------------------------
# PER-UNIT LAST-SEEN STAMPS (2026-07-24) — the fix for the shared-topic hole
# documented at lines 104-107. These fire on the MQTT MESSAGE, so they are
# immune to two traps that make every other liveness signal lie here:
#   1. HA's MQTT integration SKIPS the state write when a payload is unchanged
#      (mqtt/entity.py _message_callback writes only if attrs changed), so a
#      healthy sensor republishing an identical reading every ~16s leaves
#      last_reported / last_updated / last_changed FROZEN. Reading a frozen
#      last_reported as "sensor dead" caused a false alarm on 2026-07-24.
#   2. expire_after is re-armed by ANY message on the topic — including the
#      SIBLING 606's — so a single dead 606 never expires.
# Towers key on TOPIC (channel A/B is stable; device id rotates on battery
# swap). The two 606s share one topic, so they MUST key on id (126/174) —
# all four ids verified live on the broker 2026-07-24 20:35Z.
# now() is tz-aware in HA templates, so this timestamp math is safe.
# ---------------------------------------------------------------------------
template:
  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-Tower/B"
    sensor:
      - name: "Garage Freezer Last Seen"
        unique_id: frzmon_garage_freezer_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-Tower/A"
    sensor:
      - name: "Garage Fridge Last Seen"
        unique_id: frzmon_garage_fridge_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-606TX/1"
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.id | int(0) == 126 }}"
    sensor:
      - name: "Kitchen Fridge Last Seen"
        unique_id: frzmon_kitchen_fridge_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-606TX/1"
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.id | int(0) == 174 }}"
    sensor:
      - name: "Garage Fridge-Freezer Last Seen"
        unique_id: frzmon_garage_fridge_freezer_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

# ---------------------------------------------------------------------------
# Rate-of-rise detectors (door-ajar / slow-failure early warning) — STANDARD on
# every temp sensor. A sustained upward slope catches a cracked door or dying
# unit while the box is still in-range, long before the absolute threshold.
# min_gradient is in °F/second (F-per-hour / 3600). Two class presets:
#
#   FREEZER-CLASS  (baseline ~dead-flat, e.g. garage freezer stdev 0.21F):
#       5 F/hr · 30-min window (1800s) · automation for:5min · min_samples 5
#   FRIDGE-CLASS   (compressor cycle + frequent door-grabs, steady stdev ~0.7F):
#       8 F/hr · 45-min window (2700s) · automation for:20min · min_samples 4
#     -> the longer window + longer sustained `for` is what separates a real
#        door-ajar from a self-reversing cycle; fridge numbers are conservative
#        (protect against alert fatigue) and reviewable once each unit has a few
#        undisturbed days of clean data.
# Each *_rising binary_sensor pairs with an automation gated BELOW that unit's
# warn line, so it never double-fires with the absolute warn.
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: trend
    sensors:
      garage_freezer_rising:            # freezer-class: 5 F/hr over 30 min
        friendly_name: "Garage Freezer Rising"
        entity_id: sensor.garage_freezer_temperature
        sample_duration: 1800
        min_gradient: 0.001389
        min_samples: 5
        # max_samples 50 -> 400 (2026-07-27). `max_samples` bounds an OLDEST-EVICTED deque,
        # so the effective window is min(sample_duration, max_samples x cadence) — raising
        # sample_duration alone is a NO-OP. Tower/B republishes every ~6s and during a real
        # rise every packet differs, so 1800s needs ~300 samples; 50 capped the window at
        # ~5 MINUTES instead of 30. EVIDENCE THIS MATTERED: the 07-26 event took this
        # freezer from -3 to +17.8F and `steadily_warming` never fired — the detector went
        # on but couldn't hold the 5-min gate off a 5-min window. The absolute warn caught
        # it, so the layering held, but the rate layer was effectively dead.
        max_samples: 400
      garage_fridge_rising:             # fridge-class: 8 F/hr over 45 min
        friendly_name: "Garage Fridge Rising"
        entity_id: sensor.garage_fridge_temperature
        sample_duration: 2700
        min_gradient: 0.002222
        min_samples: 4
        max_samples: 400        # Tower/A ~8s cadence -> 2700s needs ~340; 60 capped it at ~8 min
      kitchen_fridge_rising:            # fridge-class: 8 F/hr over 45 min
        friendly_name: "Kitchen Fridge Rising"
        entity_id: sensor.kitchen_fridge_temperature
        sample_duration: 2700
        min_gradient: 0.002222
        min_samples: 4
        max_samples: 150        # 606 ~31s state-change cadence -> 2700s needs ~87
      garage_fridge_freezer_rising:     # fridge-class, DEFROST-TOLERANT: ~13 F/hr over 45 min
        # min_gradient raised 0.002222->0.0035 (2026-07-23): the daily auto-defrost
        # ramps ~1.1 F/min (66 F/hr) but the 8 F/hr setting also tripped on normal
        # band drift/reload noise. LOW CONFIDENCE — revisit after a week of data.
        friendly_name: "Garage Fridge-Freezer Rising"
        entity_id: sensor.garage_fridge_freezer_temperature
        sample_duration: 2700
        min_gradient: 0.0035
        min_samples: 4
        # 60 -> 150 (606 ~31s cadence; 2700s needs ~87, so 60 capped the window at ~31 min).
        # ⚠️ WATCH: min_gradient 0.0035 was tuned empirically on 07-23 AGAINST the shorter
        # ~31-min window. Lengthening to the intended 45 min changes the gradient fit —
        # expect FEWER flaps (longer window smooths), but re-check flap frequency in a few
        # days before trusting the tuning. This unit flapped 6x on 07-24 and is flapping
        # still; the automation's `for: 20m` gate is what has kept it from alerting.
        max_samples: 150
      outdoor_kitchen_fridge_rising:    # DASHBOARD-ONLY as of 2026-07-24 (no longer alerts)
        # Rate alerting for this unit was removed — see the note in frzmon_rising_alerts.
        # The ESPHome probe reads air, so this trend rides the ~11°F compressor cycle and
        # can't distinguish a door-ajar from a normal off-cycle. Sensor retained purely
        # for visibility on the dashboard; nothing triggers on it.
        friendly_name: "Outdoor Kitchen Fridge Rising"
        entity_id: sensor.outdoor_kitchen_fridge_temperature
        sample_duration: 2700
        min_gradient: 0.002222
        min_samples: 4
        max_samples: 150        # ESPHome 30s cadence -> 2700s needs ~90 (dashboard-only anyway)

automation:
  # ============================================================================
  # Temperature alerts — ALL units in ONE automation (2026-07-23 consolidation of
  # the former 15 per-unit warn/urgent/rising automations). Per-unit thresholds
  # live in the trigger table below; trigger.id (warn|urgent) is the case switch
  # that routes severity/channel. HA does NOT allow templating numeric_state
  # `above:`, so each unit keeps its own trigger row — but not its own automation.
  # All notifications route through script.frzmon_notify (both phones, one place).
  #
  # Thresholds retuned 2026-07-23 off 7 days of live data — DURATION-based, not
  # amplitude-based, so a slow failure that plateaus at a low temp is still caught
  # while normal auto-defrost humps (narrow, <=27 min wide) are filtered out:
  #   Garage freezer        warn >5/30m + >0/2h     urgent >10/10m   (retuned 07-24)
  #   Garage fridge         warn >42/20m + >40/2h   urgent >45/10m
  #     >42 catches a fast rise; >40-for-2h catches a stuck-at-41 drift. Both sit
  #     inside the USDA <=40-for-2h food-safety line. 43°F was actually seen 07-16.
  #   Kitchen fridge        warn >40/10m            urgent >45/10m   (unchanged; quiet)
  #   Garage fridge-freezer warn >10/45m            urgent >15/35m
  #     Defrost sustains <=27m above 10°F and <=20m above 15°F, so the long `for`
  #     filters it. The LOW absolute thresholds are kept on purpose: raising them
  #     to >25/>32 would be fail-deadly — a real failure that plateaus in the
  #     10-25°F band would never trip, and >32 only alerts at the food-melt line.
  #   Outdoor kitchen fridge: OMITTED until the ESPHome unit lands (was disabled).
  # ============================================================================
  - id: frzmon_temp_alerts
    alias: "Freezer monitor — temperature alerts (all units)"
    mode: parallel
    max: 20
    trigger:
      # RETUNED 2026-07-24 (Chris): the old warn >-5/20m became pure noise after the
      # unit stepped +10°F on 07-23 14:33Z (the battery-swap morning) — 93.6% of the
      # following 48h sat above -5 (band min -13.5 / max -1.7 / median -2.2), so warn
      # fired 3x and re-fired on every restart. Replaced with the SAME two-line shape
      # proven on the garage fridge (>42/20m + >40/2h) so raising the noisy line does
      # NOT go fail-deadly: >5/30m catches a fast rise, >0-for-2h catches a slow
      # failure that plateaus just above the USDA 0°F freezer line. Urgent unchanged.
      # ⚠️ OPEN: the +10°F step is UNEXPLAINED (probe repositioned during the swap vs
      # unit genuinely running warmer). Physical check still owed; re-baseline after.
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_freezer_temperature,        above: 0,  for: { hours: 2 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_freezer_temperature,        above: 5,  for: { minutes: 30 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.garage_freezer_temperature,        above: 10, for: { minutes: 10 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_fridge_temperature,         above: 42, for: { minutes: 20 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_fridge_temperature,         above: 40, for: { hours: 2 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.garage_fridge_temperature,         above: 45, for: { minutes: 10 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.kitchen_fridge_temperature,        above: 40, for: { minutes: 10 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.kitchen_fridge_temperature,        above: 45, for: { minutes: 10 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_fridge_freezer_temperature, above: 10, for: { minutes: 45 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.garage_fridge_freezer_temperature, above: 15, for: { minutes: 35 } }
      # Outdoor kitchen fridge (ESPHome probe) — baseline ~45F, transparent door in
      # direct afternoon sun. INITIAL warn 50 / urgent 57 (2026-07-23, per Chris);
      # nightly range-check tunes these off the observed daily band.
      - { platform: numeric_state, id: warn,   entity_id: sensor.outdoor_kitchen_fridge_temperature, above: 50, for: { minutes: 30 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.outdoor_kitchen_fridge_temperature, above: 57, for: { minutes: 20 } }
    variables:
      names:
        sensor.garage_freezer_temperature: "Garage freezer"
        sensor.garage_fridge_temperature: "Garage fridge"
        sensor.kitchen_fridge_temperature: "Kitchen fridge"
        sensor.garage_fridge_freezer_temperature: "Garage fridge-freezer"
        sensor.outdoor_kitchen_fridge_temperature: "Outdoor kitchen fridge"
    action:
      - variables:
          n: "{{ names[trigger.entity_id] | default(trigger.entity_id) }}"
          crit: "{{ trigger.id == 'urgent' }}"
      - action: script.frzmon_notify
        data:
          critical: "{{ crit }}"
          title: "{{ ('🚨 ' ~ n ~ ' FAILING') if crit else ('⚠️ ' ~ n ~ ' warming') }}"
          message: "{{ n }} is {{ trigger.to_state.state | float | round(1) }}°F (sustained over {{ trigger.above }}°F){{ ' — check it now' if crit else '' }}."

  # ---- Rate-of-rise (door-ajar / slow-failure early warning) — all units, one automation ----
  # Each *_rising trend binary_sensor fires this; the condition gates it BELOW that
  # unit's warn line so it never double-fires with the absolute warn above. Per-unit
  # temp sensor + warn line + friendly name come from the lookup dicts.
  - id: frzmon_rising_alerts
    alias: "Freezer monitor — steadily warming (all units)"
    mode: parallel
    max: 20
    trigger:
      - { platform: state, entity_id: binary_sensor.garage_freezer_rising,        to: "on", for: { minutes: 5 } }
      - { platform: state, entity_id: binary_sensor.garage_fridge_rising,         to: "on", for: { minutes: 20 } }
      - { platform: state, entity_id: binary_sensor.kitchen_fridge_rising,        to: "on", for: { minutes: 20 } }
      - { platform: state, entity_id: binary_sensor.garage_fridge_freezer_rising, to: "on", for: { minutes: 20 } }
      # Outdoor kitchen fridge DROPPED from rate detection 2026-07-24: the probe reads
      # AIR, so its normal compressor cycle swings ~11°F (33↔44°F) every 45-90 min —
      # each warming limb (~12°F/hr for ~45 min) is indistinguishable from a door-ajar,
      # firing ~7-8 false "steadily warming" pushes/day. Rate+time can't separate the
      # two for this unit. Covered instead by the absolute >50°F warn and the new 3h-mean
      # plateau alert (frzmon_outdoor_plateau). Trend sensor kept for dashboard only.
    variables:
      temp_of:
        binary_sensor.garage_freezer_rising: sensor.garage_freezer_temperature
        binary_sensor.garage_fridge_rising: sensor.garage_fridge_temperature
        binary_sensor.kitchen_fridge_rising: sensor.kitchen_fridge_temperature
        binary_sensor.garage_fridge_freezer_rising: sensor.garage_fridge_freezer_temperature
      warn_of:
        # -5 -> 0 (2026-07-27): THIS WAS A BUG I INTRODUCED ON 07-24. When the garage
        # freezer's absolute warn was retuned from >-5 to >0/>5, this gate was left at -5.
        # The condition below only alerts when temp is BELOW the warn line (to avoid
        # double-firing with the absolute warn), so with the post-step band of -4.0..-2.9
        # EVERY garage-freezer rising alert was silently suppressed. Combined with the
        # max_samples window cap, that is why the 07-26 event (-3 -> +17.8°F) produced no
        # "steadily warming" alert at all — and the stale gate was the DOMINANT cause.
        # LESSON: retuning a threshold means auditing every OTHER place that mirrors it.
        binary_sensor.garage_freezer_rising: 0
        binary_sensor.garage_fridge_rising: 40
        binary_sensor.kitchen_fridge_rising: 40
        binary_sensor.garage_fridge_freezer_rising: 10
      names:
        binary_sensor.garage_freezer_rising: "Garage freezer"
        binary_sensor.garage_fridge_rising: "Garage fridge"
        binary_sensor.kitchen_fridge_rising: "Kitchen fridge"
        binary_sensor.garage_fridge_freezer_rising: "Garage fridge-freezer"
    condition:
      - condition: template
        value_template: "{{ states(temp_of[trigger.entity_id]) | float(999) < (warn_of[trigger.entity_id] | float) }}"
      # ⚠️ RESTORED-STATE GUARD (2026-07-27). Trend binary_sensors RESTORE their previous
      # on/off state across a restart, before they have collected any samples. HA writes
      # that restored state at startup, which registers as a transition TO "on" and arms
      # this automation's `for:` timer — so every restart can produce a spurious "steadily
      # warming" push minutes later, off a trend that has not actually measured anything.
      # Observed live: right after the 00:17Z restart, garage_freezer_rising read `on` with
      # sample_count=2 against its min_samples=5. It also explains the 07-24 21:40 alert,
      # 22 min after that restart. `sample_count` >= 5 is >= the max min_samples of all
      # units here, so a restored/refilling deque cannot satisfy it — only a genuinely
      # computed trend can. (This artifact was previously masked by the stale warn_of gate
      # above; fixing that gate without adding this guard would have armed it.)
      - condition: template
        value_template: "{{ state_attr(trigger.entity_id, 'sample_count') | int(0) >= 5 }}"
    action:
      - variables:
          n: "{{ names[trigger.entity_id] }}"
          t: "{{ temp_of[trigger.entity_id] }}"
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📈 {{ n }} steadily warming"
          message: "{{ n }} is warming steadily, now {{ states(t) | float | round(1) }}°F — door ajar or failing?"

  # ---- Outdoor kitchen fridge: sustained-plateau / slow-drift warn (2026-07-24) ----
  # Covers the gap the absolute >50°F warn and the (removed) rate detector both miss:
  # a plateau in the 44-49°F band. Runs off the 3h mean so normal compressor cycling
  # can't trip it. Threshold 44°F is PROVISIONAL / low-confidence — observed normal 3h
  # mean is ~40°F (band peaks ~44°F). The nightly range-check cron + a week of settled
  # data should tune it. CAVEAT: the adoption baseline was logged ~45-47°F (07-23),
  # which conflicts with today's 33-44°F band — reconcile that before hardening 44/50/57.
  - id: frzmon_outdoor_plateau
    alias: "Freezer monitor — outdoor kitchen fridge sustained warm (plateau)"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.outdoor_kitchen_fridge_3h_mean
        above: 44
        for: { minutes: 30 }
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "🌡️ Outdoor kitchen fridge running warm"
          message: "Outdoor kitchen fridge has averaged {{ states('sensor.outdoor_kitchen_fridge_3h_mean') | float | round(1) }}°F over the last 3h — running warm (possible slow failure or seal issue)."

  # ---- Outdoor kitchen fridge: PULL-DOWN FAILURE (2026-07-27) ----
  # Fires only if the unit fails to reach 40°F at ANY point in 24h — i.e. it has lost
  # the ability to pull down at all. Deliberately insensitive to ambient: the peaks and
  # the 3h mean both climb with the weather (07-27 max hit 55.4 and the 3h mean 51.6,
  # tripping the >50 warn and the >44 plateau truthfully but un-actionably), while the
  # daily FLOOR held at 33.9. This is the complement to those two: they say "it's warm",
  # this says "it's broken". Threshold 40 leaves ~5°F of headroom over the observed
  # floor. Low stakes per Chris — this unit only stores water, no food-safety exposure.
  - id: frzmon_outdoor_pulldown
    alias: "Freezer monitor — outdoor kitchen fridge not pulling down (24h floor)"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.outdoor_kitchen_fridge_24h_min
        above: 40
        for: { minutes: 60 }
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "🧊 Outdoor kitchen fridge not cooling down"
          message: "Outdoor kitchen fridge has not gotten below {{ states('sensor.outdoor_kitchen_fridge_24h_min') | float | round(1) }}°F in 24h (healthy floor is ~34°F). It is failing to pull down — compressor or door seal, not just hot weather."

  # ===================== OFFLINE (no reading) =====================
  # `for` widened 1m -> 15m to ride out brief WiFi/reception gaps; a genuinely dead
  # sensor still flags after ~25m. Tower/B (garage chest freezer) stays IN — its
  # multi-hour dropouts are a real "failing / out of range" signal, not noise.
  # Outdoor kitchen fridge RE-ADDED 2026-07-23: now on the reliable ESPHome/WiFi
  # unit (was dropped while on the marginal 433 link). This offline alert is the
  # ONLY silent-death guard for it — the ESPHome unit is USB-powered so it has no
  # battery alert, and unavailable temp can't fire the numeric/rising triggers.
  - id: frzmon_sensor_offline
    alias: "Freezer monitor — sensor offline"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - sensor.garage_freezer_temperature
          - sensor.garage_fridge_temperature
          - sensor.kitchen_fridge_temperature
          - sensor.garage_fridge_freezer_temperature
          - sensor.outdoor_kitchen_fridge_temperature
        to: "unavailable"
        for: { minutes: 15 }
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📡 Fridge/freezer sensor offline"
          message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} — no reading for ~25 min (battery/range?)."

  # ===================== LOW BATTERY =====================
  - id: frzmon_sensor_low_battery
    alias: "Freezer monitor — low battery"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.garage_freezer_sensor_battery
          - binary_sensor.garage_fridge_sensor_battery
          - binary_sensor.kitchen_fridge_sensor_battery
          - binary_sensor.garage_fridge_freezer_sensor_battery
        to: "on"
        for: { minutes: 5 }
    action:
      - action: script.frzmon_notify
        data:
          importance: default
          title: "🔋 Fridge/freezer sensor low battery"
          message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} reports low battery — swap in lithium AAs."

  # ===================== PER-UNIT STALENESS SWEEP (2026-07-24) =====================
  # Restart-proof, per-unit silent-death guard. Closes TWO independent gaps that
  # frzmon_sensor_offline (above) cannot:
  #   1. That automation is TRANSITION-ONLY (`to: "unavailable"` + for: 15m). Pending
  #      `for:` timers do not survive a restart/reload, and HA does not re-fire a
  #      state trigger against an already-matching state — so a sensor that dies just
  #      before or during a restart is NEVER reported. This is the identical bug fixed
  #      in the water-leak watchdog on 2026-07-06 by adding a time sweep; the freezer
  #      stack never got that treatment. It is also the ONLY silent-death guard for
  #      the ESPHome outdoor unit (see lines 396-399), so that unit was exposed too.
  #   2. A single dead 606 never expires at all, because expire_after is re-armed by
  #      the SIBLING 606's messages on the shared topic (lines 104-107).
  # Judged off the per-unit *_last_seen stamps, NOT off `unavailable`, and NOT off
  # last_reported (which FREEZES on identical MQTT payloads — that trap caused a
  # false "dead sensor" alarm on 2026-07-24). The outdoor unit is ESPHome/native-API,
  # where an unchanged write DOES advance last_reported, so it uses that instead.
  # 433 units transmit every ~6-25s, so 25 min is 60+ missed messages — clear of the
  # known RF burst gaps while still well inside food-safety timescales.
  - id: frzmon_staleness_sweep
    alias: "Freezer monitor — per-unit staleness sweep"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    variables:
      max_age_min: 25
      units:
        - { name: "Garage freezer",         seen: "sensor.garage_freezer_last_seen",        temp: "sensor.garage_freezer_temperature" }
        - { name: "Garage fridge",          seen: "sensor.garage_fridge_last_seen",         temp: "sensor.garage_fridge_temperature" }
        - { name: "Kitchen fridge",         seen: "sensor.kitchen_fridge_last_seen",        temp: "sensor.kitchen_fridge_temperature" }
        - { name: "Garage fridge-freezer",  seen: "sensor.garage_fridge_freezer_last_seen", temp: "sensor.garage_fridge_freezer_temperature" }
        # ESPHome/native API — no MQTT topic, so fall back to last_reported (valid here).
        - { name: "Outdoor kitchen fridge", seen: "",                                       temp: "sensor.outdoor_kitchen_fridge_temperature" }
      # Trigger-based template sensors do NOT restore across a restart — they start
      # `unknown` until their first message. A unit that is DEAD at restart time
      # therefore has no stamp, and (if it is a 606 whose sibling still transmits)
      # its temp entity is NOT unavailable either — which would re-open the very hole
      # this sweep exists to close. So a missing stamp counts as STALE, guarded by a
      # 10-minute boot grace so a healthy fleet (stamps land within ~30s of MQTT
      # connecting) can't produce a spurious alert right after a restart/reload.
      # Deliberately fail-LOUD: worst case is one nuisance push, never a silent death.
      stale: >-
        {% set ns = namespace(items=[]) %}
        {% set me = states.automation.freezer_monitor_per_unit_staleness_sweep %}
        {% set boot_grace = me is none or (now() - me.last_changed).total_seconds() < 600 %}
        {% for u in units %}
          {% set t = states(u.temp) %}
          {% if t in ['unavailable', 'unknown'] %}
            {% set ns.items = ns.items + [u.name ~ ' (no reading)'] %}
          {% else %}
            {% set dt = none %}
            {% if u.seen %}
              {% set s = states(u.seen) %}
              {% if s in ['unknown', 'unavailable'] %}
                {% if not boot_grace %}
                  {% set ns.items = ns.items + [u.name ~ ' (no last-seen stamp)'] %}
                {% endif %}
              {% else %}
                {% set dt = s | as_datetime %}
              {% endif %}
            {% else %}
              {% set dt = states[u.temp].last_reported %}
            {% endif %}
            {% if dt is not none %}
              {% set age = ((now() - dt).total_seconds() / 60) | round | int %}
              {% if age > max_age_min %}
                {% set ns.items = ns.items + [u.name ~ ' (' ~ age ~ 'm silent)'] %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items | join(', ') }}
    condition:
      # `| trim` is deliberate, not decorative: the `stale` template is built from
      # {% %} control blocks, so it renders with surrounding whitespace. HA does strip
      # rendered results, but if that ever changed, a bare `| length > 0` would be
      # TRUE on every sweep and push an empty alert every 5 min. Trim makes it explicit.
      - condition: template
        value_template: "{{ stale | trim | length > 0 }}"
      # ⚠️ REPEAT SUPPRESSION (added 2026-07-27 — fixing MY bug). As first shipped this
      # sweep re-notified on EVERY 5-min pass for as long as anything was stale: the real
      # dual-606 outage on 07-27 00:05-01:05 produced 13 sweep fires (+2 from the
      # transition-based offline automation) = ~30 phone pushes in about an hour. That is
      # the exact alert fatigue the 17->4 consolidation existed to kill. The leak sweep
      # this was modeled on can't spam because it only runs 3x/day; this one runs 12x/hr.
      # Cooldown keyed on the automation's OWN last_triggered — which only advances when
      # the automation actually RUNS (i.e. when conditions passed and we notified), so it
      # is a true "last time we alerted" stamp and needs no helper entity. Conditions are
      # evaluated BEFORE the run, so this reads the PREVIOUS notification's time.
      # Every message already lists ALL currently-stale units, so a unit going stale
      # inside the cooldown is still reported on the next pass (<=1h later), and the
      # transition-based frzmon_sensor_offline covers new drops independently.
      # last_triggered resets to None on restart -> first post-restart alert is immediate
      # (fail-loud, deliberate).
      - condition: template
        value_template: >-
          {% set lt = state_attr('automation.freezer_monitor_per_unit_staleness_sweep', 'last_triggered') %}
          {{ lt is none or (now() - lt).total_seconds() > 3600 }}
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📡 Fridge/freezer sensor silent"
          message: "No data from: {{ stale }} (>{{ max_age_min }} min silent). Per-unit sweep, runs every 5 min."

# ---------------------------------------------------------------------------
# Shared notifier — sends to BOTH phones from one place (this replaced the
# duplicated iPhone+Pixel action pair in every one of the former 17 automations).
#   critical=true  -> "Critical Home Alerts" channel + iOS time-sensitive push
#   critical=false -> "Home Alerts" channel
#   importance      -> Android channel importance; defaults high, low-battery
#                      passes 'default' to stay a quiet/routine alert.
# ---------------------------------------------------------------------------
script:
  frzmon_notify:
    alias: "Freezer monitor — notify both phones"
    mode: parallel
    max: 20
    fields:
      title:
        description: "Notification title"
        example: "⚠️ Garage fridge warming"
      message:
        description: "Notification body"
        example: "Garage fridge is 42°F (sustained over 42°F)."
      critical:
        description: "Route to Critical Home Alerts + iOS time-sensitive"
        default: false
      importance:
        description: "Android importance: high or default"
        default: high
    sequence:
      # Defaults are applied HERE with Jinja `default()`, NOT via the `fields:`
      # `default:` keys above — HA does not reliably inject field defaults as
      # template variables, so an omitted `importance`/`critical` would render
      # empty and Android rejects an empty channel-importance (verified 2026-07-23).
      - variables:
          crit: "{{ critical | default(false) | bool }}"
          imp: "{{ importance | default('high') }}"
          chan: "{{ 'Critical Home Alerts' if crit else 'Home Alerts' }}"
          prio: "{{ 'high' if imp == 'high' else 'default' }}"
      - parallel:
          - action: notify.mobile_app_chriss_iphone
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data:
                channel: "{{ chan }}"
                importance: "{{ imp }}"
                priority: "{{ prio }}"
                ttl: 0
                push:
                  interruption-level: "{{ 'time-sensitive' if crit else 'active' }}"
          - action: notify.mobile_app_pixel_9_pro_xl
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data:
                channel: "{{ chan }}"
                importance: "{{ imp }}"
                priority: "{{ prio }}"
                ttl: 0
