# Freezer / Fridge Temperature Monitoring — HA package
# ---------------------------------------------------------------------------
# Deploy: copy to the Green at /config/packages/freezer_monitoring.yaml.
# configuration.yaml already includes:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Sensor map (current 2026-07-18):
#   Garage freezer       = 592TXR "Acurite-Tower" ch B (id 2082) — temp+humidity
#   Garage fridge        = 592TXR "Acurite-Tower" ch A (id 13260) — temp+humidity
#   Kitchen fridge       = 606TX "Acurite-606TX" (id 126) — TEMP ONLY
#   Garage fridge-freezer= 606TX "Acurite-606TX" (id 174) — TEMP ONLY
#   The two 606s SHARE topic Acurite-606TX/1 (no channel switch) — split by `id`
#   in each value_template (see the 606 section below).
#   Outdoor kitchen fridge= Acurite-00276rm monitor (id 5978) + 06011RM PROBE —
#     probe temp in temperature_1_C (inside the box), body/ambient in temperature_C.
#
# 592TXR Towers key on the A/B/C slide switch (STABLE; device id rotates on
# battery change). 606TX has no switch — rtl_433 always tags it channel 1, so it
# publishes to rtl_433/devices/Acurite-606TX/1. Topics never collide.
#
# History note: channel A (592TXR id 13260, has humidity) WAS the kitchen fridge,
# then briefly the outdoor fridge, then parked. On 2026-07-15 it was placed in the
# GARAGE FRIDGE and wired up here. The kitchen fridge runs on the 606 now — the
# 606 couldn't reach from the OUTDOOR kitchen fridge (metal box + distance blocks
# 433MHz, even the stronger Tower went silent sealed inside), but it's rock-solid
# at the indoor kitchen fridge.
#
# Outdoor kitchen fridge: WIRED 2026-07-18 — AcuRite 00276rm monitor + 06011RM
# plug-in probe. rtl_433 decodes it as "Acurite-00276rm" (the earlier "00275rm"
# guess was wrong — verified off the live stream). PROBE temp = temperature_1_C
# (probe on a lead INSIDE the box), body/ambient = temperature_C. This keeps the
# transmitter OUTSIDE the metal box — the only architecture that beats the
# Faraday cage. (The 986 was a WRONG call — its pucks mount inside → same failure
# as the 606.) That spot was marginal even open-air, so it likely still wants
# receiver-side RF help; expire_after is set generous (900s) pending observed
# reception density at the real location.
#
# rtl_433 publishes per-device JSON to rtl_433/devices/<model>/<channel>. Tower
# keys: temperature_C, humidity, battery_ok, channel; 606TX: no humidity.
# expire_after (offline window) is per-sensor. Sniff live stream to debug:
#   ssh ha-green → mosquitto_sub -h core-mosquitto -u rtl433 -P <pw> -t 'rtl_433/devices/#' -v
#   (broker creds live in the mosquitto add-on options via the supervisor API)
#
# NOTE (2026-07-14): the SDR also hears an Acurite-609TXC (id 204) reporting a
# LOW battery — a one-piece temp+humidity sensor (NOT a probe model),
# unidentified/unplaced, intentionally NOT wired here yet.
# ---------------------------------------------------------------------------

mqtt:
  sensor:
    # ==== Garage freezer : channel B ====
    - name: "Garage Freezer Temperature"
      unique_id: frzmon_garage_freezer_temp
      state_topic: "rtl_433/devices/Acurite-Tower/B"
      value_template: >-
        {% if value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600
    - name: "Garage Freezer Humidity"
      unique_id: frzmon_garage_freezer_humidity
      state_topic: "rtl_433/devices/Acurite-Tower/B"
      value_template: "{{ value_json.humidity | int }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      expire_after: 600

    # ==== Garage refrigerator : channel A (592TXR id 13260) ====
    - name: "Garage Fridge Temperature"
      unique_id: frzmon_garage_fridge_temp
      state_topic: "rtl_433/devices/Acurite-Tower/A"
      value_template: >-
        {% if value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600
    - name: "Garage Fridge Humidity"
      unique_id: frzmon_garage_fridge_humidity
      state_topic: "rtl_433/devices/Acurite-Tower/A"
      value_template: "{{ value_json.humidity | int }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      expire_after: 600

    # ==== Two Acurite-606TX share ONE topic — filter by `id` (temp-only) ====
    # The 606TX has NO channel switch, so rtl_433 tags EVERY 606 as channel 1 →
    # both publish to rtl_433/devices/Acurite-606TX/1. They're told apart ONLY by
    # the `id` field in the payload, so each sensor's value_template must gate on
    # its id and return `this.state` for the other unit's messages (else the two
    # readings clobber each other). 606 ids are stable (unlike the Towers, whose
    # ids rotate on battery swap — that's why Towers key on the A/B/C channel).
    #   id 126 = Kitchen fridge (indoor, ~33°F). id 174 = Garage Fridge-Freezer
    #   (the combo garage fridge's FREEZER compartment; distinct from the
    #   standalone chest "Garage Freezer" on Tower/B).
    # Caveat: expire_after resets on ANY 606 message on the shared topic, so
    # per-unit OFFLINE detection is weak — a single 606 dying isn't flagged offline
    # while the other still transmits (low-battery alert still covers battery death;
    # total SDR/reception loss still trips offline for both).
    - name: "Kitchen Fridge Temperature"
      unique_id: frzmon_kitchen_fridge_temp
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 126 and value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600

    # ==== Garage Fridge-Freezer : Acurite-606TX id 174 (temp-only) ====
    - name: "Garage Fridge-Freezer Temperature"
      unique_id: frzmon_garage_fridge_freezer_temp
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 174 and value_json.temperature_C is defined %}
          {{ (value_json.temperature_C | float * 9 / 5 + 32) | round(1) }}
        {% else %}{{ this.state | default('unknown', true) }}{% endif %}
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      expire_after: 600

    # ==== Outdoor kitchen fridge ==== 00276rm 433 MQTT sensors RETIRED
    # 2026-07-23: replaced by a local ESPHome ATOM S3 Lite + DS18B20 probe
    # (native HA API, "Outdoor Kitchen Fridge" @ 192.168.224.22), which now
    # owns sensor.outdoor_kitchen_fridge_temperature. 00276rm = garage spare.

  binary_sensor:
    - name: "Garage Freezer Sensor Battery"
      unique_id: frzmon_garage_freezer_batt
      state_topic: "rtl_433/devices/Acurite-Tower/B"
      value_template: "{{ value_json.battery_ok | int }}"
      payload_on: "0"        # battery_ok = 0 -> low (device_class battery: on = low)
      payload_off: "1"
      device_class: battery
      expire_after: 600
    - name: "Garage Fridge Sensor Battery"
      unique_id: frzmon_garage_fridge_batt
      state_topic: "rtl_433/devices/Acurite-Tower/A"
      value_template: "{{ value_json.battery_ok | int }}"
      payload_on: "0"
      payload_off: "1"
      device_class: battery
      expire_after: 600
    # Two 606s share this topic — gate on id, hold prior state otherwise
    # (this.state is "on"/"off" post-mapping → re-emit as "0"/"1").
    - name: "Kitchen Fridge Sensor Battery"
      unique_id: frzmon_kitchen_fridge_batt
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 126 %}{{ value_json.battery_ok | int }}
        {% else %}{{ '0' if this.state == 'on' else '1' }}{% endif %}
      payload_on: "0"
      payload_off: "1"
      device_class: battery
      expire_after: 600
    - name: "Garage Fridge-Freezer Sensor Battery"
      unique_id: frzmon_garage_fridge_freezer_batt
      state_topic: "rtl_433/devices/Acurite-606TX/1"
      value_template: >-
        {% if value_json.id == 174 %}{{ value_json.battery_ok | int }}
        {% else %}{{ '0' if this.state == 'on' else '1' }}{% endif %}
      payload_on: "0"
      payload_off: "1"
      device_class: battery
      expire_after: 600
    # (Outdoor kitchen fridge battery sensor removed 2026-07-23 — ESPHome unit is USB-powered.)

# ---------------------------------------------------------------------------
# Derived sensors — 3-hour rolling mean of the outdoor kitchen fridge (the
# "software glycol bottle", 2026-07-24). The ESPHome probe reads AIR, so the raw
# reading swings ~11°F with every compressor cycle (33↔44°F, 45-90 min). A 3h mean
# is immune to that cycling by construction and exposes a sustained plateau / slow
# drift that neither the absolute >50°F warn nor the rate detector can see — a
# failure that stalls in the 44-49°F band never crosses 50 and has no lasting
# gradient, yet the air is already past the 40°F USDA line at every cycle peak.
# ---------------------------------------------------------------------------
sensor:
  - platform: statistics
    name: "Outdoor Kitchen Fridge 3h Mean"
    unique_id: frzmon_outdoor_kitchen_fridge_mean_3h
    entity_id: sensor.outdoor_kitchen_fridge_temperature
    state_characteristic: mean
    max_age:
      hours: 3
    sampling_size: 500        # 3h @ 30s ≈ 360 samples; headroom so max_age governs the window
    precision: 1

  # ---- PULL-DOWN FLOOR (2026-07-27) — the specific health signal for an air-probe
  # fridge in swinging ambient. The mean and the peaks mostly track WEATHER; the
  # FLOOR tracks the refrigeration. A healthy unit reaches its trough every cycle no
  # matter how hot it is outside; a failing compressor or a bad seal cannot.
  # Evidence for using 24h and not 3h: measured rolling 3h minima over 07-26/07-27
  # were 34.9 34.9 34.7 34.6 34.9 35.6 38.9 38.8 36.5 33.9 34.1 34.3 34.3 35.9 40.3 42.9
  # — the hot-afternoon troughs climb to 38.9-42.9, so a "3h min > 38" rule (my first
  # proposal) would have FALSE-FIRED on 4 of 16 windows. Over a full 24h the floor is
  # rock solid: daily minima 33.0 / 33.6 / 34.6 / 33.9 across 07-24..07-27, even as
  # daily MAXIMA climbed 48.5 -> 55.4. So >40 for 24h means it genuinely never got
  # cold all day = real failure, and a heat wave alone cannot trip it.
  # Name MUST keep the `_min` suffix: the Guardian panel excludes
  # /_(mean|median|average|avg|min|max|stdev)$/ so derived stats don't duplicate the
  # real probe's tile (the 3h mean did exactly that once).
  - platform: statistics
    name: "Outdoor Kitchen Fridge 24h Min"
    unique_id: frzmon_outdoor_kitchen_fridge_min_24h
    entity_id: sensor.outdoor_kitchen_fridge_temperature
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 3200      # 24h @ 30s ≈ 2880; headroom so max_age governs the window
    precision: 1

  # ---- 24h FLOOR for the two FOOD fridges (2026-08-03) ----
  # Chris, 08-03: "I want warnings when there is, or could be, a problem or a trend
  # that indicates one might be coming" — not a page every time a door opens. The 24h
  # floor is that early signal, and it is the one this project already proved out on
  # the outdoor unit: a box loses the ability to PULL DOWN before it loses the danger
  # zone, so the floor rises days before any absolute line is threatened. Peaks and
  # means track ambient and usage; the floor tracks the appliance.
  # Until now only the outdoor unit (which stores water, no food exposure) had one.
  # ⚠️ sampling_size is deliberately sized off the MQTT PUBLISH cadence, NOT the
  # observed state-change rate. `sampling_size` bounds an oldest-evicted deque, so the
  # effective window is min(max_age, sampling_size × cadence) — undersizing it silently
  # shortens the window and the sensor still looks healthy. That exact trap capped the
  # trend sensors at ~5 min instead of 30 on 07-27. Tower A publishes ~every 17.7s
  # (4881/24h ceiling) and the 606 ~every 31s (2787/24h ceiling); observed CHANGE rates
  # are far lower (~800 and ~200/24h) but a failing unit swings more and logs more.
  - platform: statistics
    name: "Garage Fridge 24h Min"
    unique_id: frzmon_garage_fridge_min_24h
    entity_id: sensor.garage_fridge_temperature
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 5500
    precision: 1

  - platform: statistics
    name: "Kitchen Fridge 24h Min"
    unique_id: frzmon_kitchen_fridge_min_24h
    entity_id: sensor.kitchen_fridge_temperature
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 3200
    precision: 1

  # ---- CUMULATIVE DANGER-ZONE EXPOSURE (2026-08-03) ----
  # THE DEFECT THIS FIXES, measured rather than theorised: on 07-27 the garage fridge
  # spent 217.4 minutes above 40°F in one day, but its longest CONTINUOUS run above 40
  # was only 69.7 min — so `>40 for 2h` never matured and nothing fired, on a day that
  # exceeded the USDA cumulative limit by nearly 2x. A `for:` gate demands an unbroken
  # breach; a fridge cycling across its own line resets it every few minutes (~70 resets
  # on 07-28 alone). The USDA rule is CUMULATIVE time in the 40-140°F danger zone, so
  # the instrument has to count minutes, not require continuity.
  # (Caveat kept for honesty: the probe was DOOR-mounted on 07-27, the warmest zone in
  # the box, so real food risk that day was lower than 217 min implies. The mechanism
  # failure is real regardless, and the probe now sits mid-shelf — an actual food zone.)
  # history_stats reads from the recorder, so these survive a restart rather than
  # re-arming from zero the way a `for:` timer does.
  - platform: history_stats
    name: "Garage Fridge Hours Above 40F 24h"
    unique_id: frzmon_garage_fridge_danger_24h
    entity_id: binary_sensor.garage_fridge_above_40
    state: "on"
    type: time
    end: "{{ now() }}"
    duration:
      hours: 24

  - platform: history_stats
    name: "Kitchen Fridge Hours Above 40F 24h"
    unique_id: frzmon_kitchen_fridge_danger_24h
    entity_id: binary_sensor.kitchen_fridge_above_40
    state: "on"
    type: time
    end: "{{ now() }}"
    duration:
      hours: 24

# ---------------------------------------------------------------------------
# PER-UNIT LAST-SEEN STAMPS (2026-07-24) — the fix for the shared-topic hole
# documented at lines 104-107. These fire on the MQTT MESSAGE, so they are
# immune to two traps that make every other liveness signal lie here:
#   1. HA's MQTT integration SKIPS the state write when a payload is unchanged
#      (mqtt/entity.py _message_callback writes only if attrs changed), so a
#      healthy sensor republishing an identical reading every ~16s leaves
#      last_reported / last_updated / last_changed FROZEN. Reading a frozen
#      last_reported as "sensor dead" caused a false alarm on 2026-07-24.
#   2. expire_after is re-armed by ANY message on the topic — including the
#      SIBLING 606's — so a single dead 606 never expires.
# Towers key on TOPIC (channel A/B is stable; device id rotates on battery
# swap). The two 606s share one topic, so they MUST key on id (126/174) —
# all four ids verified live on the broker 2026-07-24 20:35Z.
# now() is tz-aware in HA templates, so this timestamp math is safe.
# ---------------------------------------------------------------------------
template:
  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-Tower/B"
    sensor:
      - name: "Garage Freezer Last Seen"
        unique_id: frzmon_garage_freezer_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-Tower/A"
    sensor:
      - name: "Garage Fridge Last Seen"
        unique_id: frzmon_garage_fridge_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-606TX/1"
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.id | int(0) == 126 }}"
    sensor:
      - name: "Kitchen Fridge Last Seen"
        unique_id: frzmon_kitchen_fridge_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: mqtt
        topic: "rtl_433/devices/Acurite-606TX/1"
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.id | int(0) == 174 }}"
    sensor:
      - name: "Garage Fridge-Freezer Last Seen"
        unique_id: frzmon_garage_fridge_freezer_last_seen
        device_class: timestamp
        state: "{{ now().isoformat() }}"

  # ---- 433 RECEPTION HEALTH (2026-07-27) ----
  # Worst per-unit gap across all four 433 sensors, in minutes. Healthy is ~0-1 (the
  # Towers transmit every ~6-16s, the 606s every ~25-31s). This exists to make reception
  # DEGRADATION visible and trendable BEFORE it becomes an outage, and to serve as the
  # measurement instrument if the SDR is ever tuned: record this over a few days, change
  # one rtl_433 setting, compare. Recorded as a measurement so it graphs.
  # Rendering note: templates containing now() are re-evaluated by HA every minute, which
  # is exactly the cadence wanted here — no trigger needed.
  # ---- DEFROST WINDOW (2026-07-30) ----
  # The garage fridge-freezer runs an ADAPTIVE auto-defrost: 1-2 episodes per day at
  # wandering clock times (measured 05:25Z, 17:42Z, 18:01Z, 19:02Z, 19:46Z, 06:10Z over
  # four days), peaking 26-29°F for 32-38 min. It warms the shared cabinet, and since
  # the fridge probe moved to the back of the top shelf it sees that too: the fridge
  # climbs ~10-13°F/hr to 35-37°F and falls straight back. That limb clears the 8°F/hr
  # fridge-class rate gate, so a defrost landing overnight pages a false "steadily
  # warming" (it did at 01:31 CDT on 07-30). This flag exists to suppress that — see the
  # rate automation, where the suppression is TIME-BOUNDED so a genuine failure that
  # parks the freezer above 10°F cannot mute the fridge's rate alert indefinitely.
  - binary_sensor:
      - name: "Garage Fridge-Freezer Defrost"
        unique_id: frzmon_garage_frdgfrzr_defrost
        icon: mdi:snowflake-melt
        state: >-
          {{ states('sensor.garage_fridge_freezer_temperature') | float(-99) > 10 }}

      # ---- DANGER-ZONE FLAGS (2026-08-03) ----
      # Plumbing only: these exist so the history_stats sensors above have a binary
      # state to accumulate. 40°F is the USDA refrigeration line. Nothing alerts on
      # these directly — a bare "above 40" would page on every door opening, which is
      # exactly what Chris asked NOT to happen. The alert is on the 24h TOTAL.
      # float(-99) defaults COLD on a missing/garbage reading so a dead sensor cannot
      # silently accumulate danger-zone minutes and page; the staleness sweep and the
      # offline alert are what cover an absent sensor.
      - name: "Garage Fridge Above 40"
        unique_id: frzmon_garage_fridge_above_40
        icon: mdi:thermometer-alert
        state: >-
          {{ states('sensor.garage_fridge_temperature') | float(-99) > 40 }}

      - name: "Kitchen Fridge Above 40"
        unique_id: frzmon_kitchen_fridge_above_40
        icon: mdi:thermometer-alert
        state: >-
          {{ states('sensor.kitchen_fridge_temperature') | float(-99) > 40 }}

  - sensor:
      - name: "433 Reception Worst Gap"
        unique_id: frzmon_433_worst_gap
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:antenna
        state: >-
          {% set stamps = [
            states('sensor.garage_freezer_last_seen'),
            states('sensor.garage_fridge_last_seen'),
            states('sensor.kitchen_fridge_last_seen'),
            states('sensor.garage_fridge_freezer_last_seen') ] %}
          {% set ns = namespace(worst=0) %}
          {% for s in stamps %}
            {% set dt = s | as_datetime %}
            {% if dt is not none %}
              {% set age = (now() - dt).total_seconds() / 60 %}
              {% if age > ns.worst %}{% set ns.worst = age %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.worst | round(1) }}
        attributes:
          worst_unit: >-
            {% set units = {
              'Garage freezer': 'sensor.garage_freezer_last_seen',
              'Garage fridge': 'sensor.garage_fridge_last_seen',
              'Kitchen fridge': 'sensor.kitchen_fridge_last_seen',
              'Garage fridge-freezer': 'sensor.garage_fridge_freezer_last_seen' } %}
            {% set ns = namespace(worst=-1, who='none') %}
            {% for name, ent in units.items() %}
              {% set dt = states(ent) | as_datetime %}
              {% if dt is not none %}
                {% set age = (now() - dt).total_seconds() / 60 %}
                {% if age > ns.worst %}{% set ns.worst = age %}{% set ns.who = name %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.who }}

# ---------------------------------------------------------------------------
# Rate-of-rise detectors (door-ajar / slow-failure early warning) — STANDARD on
# every temp sensor. A sustained upward slope catches a cracked door or dying
# unit while the box is still in-range, long before the absolute threshold.
# min_gradient is in °F/second (F-per-hour / 3600). Two class presets:
#
#   FREEZER-CLASS  (baseline ~dead-flat, e.g. garage freezer stdev 0.21F):
#       5 F/hr · 30-min window (1800s) · automation for:5min · min_samples 5
#   FRIDGE-CLASS   (compressor cycle + frequent door-grabs, steady stdev ~0.7F):
#       8 F/hr · 45-min window (2700s) · automation for:20min · min_samples 4
#     -> the longer window + longer sustained `for` is what separates a real
#        door-ajar from a self-reversing cycle; fridge numbers are conservative
#        (protect against alert fatigue) and reviewable once each unit has a few
#        undisturbed days of clean data.
# Each *_rising binary_sensor pairs with an automation gated BELOW that unit's
# warn line, so it never double-fires with the absolute warn.
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: trend
    sensors:
      garage_freezer_rising:            # freezer-class: 5 F/hr over 30 min
        friendly_name: "Garage Freezer Rising"
        entity_id: sensor.garage_freezer_temperature
        sample_duration: 1800
        min_gradient: 0.001389
        min_samples: 5
        # max_samples 50 -> 400 (2026-07-27). `max_samples` bounds an OLDEST-EVICTED deque,
        # so the effective window is min(sample_duration, max_samples x cadence) — raising
        # sample_duration alone is a NO-OP. Tower/B republishes every ~6s and during a real
        # rise every packet differs, so 1800s needs ~300 samples; 50 capped the window at
        # ~5 MINUTES instead of 30. EVIDENCE THIS MATTERED: the 07-26 event took this
        # freezer from -3 to +17.8F and `steadily_warming` never fired — the detector went
        # on but couldn't hold the 5-min gate off a 5-min window. The absolute warn caught
        # it, so the layering held, but the rate layer was effectively dead.
        max_samples: 400
      garage_fridge_rising:             # fridge-class: 8 F/hr over 45 min
        friendly_name: "Garage Fridge Rising"
        entity_id: sensor.garage_fridge_temperature
        sample_duration: 2700
        min_gradient: 0.002222
        min_samples: 4
        max_samples: 400        # Tower/A ~8s cadence -> 2700s needs ~340; 60 capped it at ~8 min
      kitchen_fridge_rising:            # fridge-class: 8 F/hr over 45 min
        friendly_name: "Kitchen Fridge Rising"
        entity_id: sensor.kitchen_fridge_temperature
        sample_duration: 2700
        min_gradient: 0.002222
        min_samples: 4
        max_samples: 150        # 606 ~31s state-change cadence -> 2700s needs ~87
      garage_fridge_freezer_rising:     # fridge-class, DEFROST-TOLERANT
        # 0.002222 -> 0.0035 (2026-07-23, LOW CONFIDENCE, tuned against a then-broken
        # ~31-min window) -> 0.0075 (2026-08-03, MEASURED over 3.5 days of the corrected
        # 45-min window). The 07-23 note asked for a re-check after a week of data; this
        # is it, and the old value was far too low.
        # Measured 45-min rolling gradient, n=5199 samples: p90 14.2, p95 15.2 F/hr for
        # normal cycling, against defrost ramps that reach 69-71 F/hr. The old gate of
        # 12.6 F/hr sat BELOW the normal p90, so 18.8% of all samples exceeded it and the
        # sensor flapped ~10x/night on the ~55-min compressor cycle; only the automation's
        # `for: 20m` kept most of that off Chris's phone, and twice on 08-01 it did not
        # (17:35 and 23:45 pushes). At 27 F/hr the longest NON-defrost sustained run
        # collapses from 28.9 min to 3.1 min — far under the 20-min gate — while the
        # defrost ramp still clears it by 2.6x.
        # ⚠️ A GATE CHANGE ALONE CANNOT WORK, and this is why the defrost suppression was
        # extended to this unit in the same commit: the defrost ramp is both steep AND
        # long, sustaining 28.9-32 min above 27 F/hr, so NO gate value stops it maturing
        # the 20-min timer (even 35 F/hr still sustains 25.8 min). Raising the number
        # alone would only have traded ~10 cycling flaps for a defrost push every day.
        friendly_name: "Garage Fridge-Freezer Rising"
        entity_id: sensor.garage_fridge_freezer_temperature
        sample_duration: 2700
        min_gradient: 0.0075     # 27 F/hr — between normal p95 (15.2) and defrost (69-71)
        min_samples: 4
        # 60 -> 150 (606 ~31s cadence; 2700s needs ~87, so 60 capped the window at ~31 min).
        max_samples: 150
      outdoor_kitchen_fridge_rising:    # DASHBOARD-ONLY as of 2026-07-24 (no longer alerts)
        # Rate alerting for this unit was removed — see the note in frzmon_rising_alerts.
        # The ESPHome probe reads air, so this trend rides the ~11°F compressor cycle and
        # can't distinguish a door-ajar from a normal off-cycle. Sensor retained purely
        # for visibility on the dashboard; nothing triggers on it.
        friendly_name: "Outdoor Kitchen Fridge Rising"
        entity_id: sensor.outdoor_kitchen_fridge_temperature
        sample_duration: 2700
        min_gradient: 0.002222
        min_samples: 4
        max_samples: 150        # ESPHome 30s cadence -> 2700s needs ~90 (dashboard-only anyway)

automation:
  # ============================================================================
  # Temperature alerts — ALL units in ONE automation (2026-07-23 consolidation of
  # the former 15 per-unit warn/urgent/rising automations). Per-unit thresholds
  # live in the trigger table below; trigger.id (warn|urgent) is the case switch
  # that routes severity/channel. HA does NOT allow templating numeric_state
  # `above:`, so each unit keeps its own trigger row — but not its own automation.
  # All notifications route through script.frzmon_notify (both phones, one place).
  #
  # Thresholds retuned 2026-07-23 off 7 days of live data — DURATION-based, not
  # amplitude-based, so a slow failure that plateaus at a low temp is still caught
  # while normal auto-defrost humps (narrow, <=27 min wide) are filtered out:
  #   Garage freezer        warn >5/30m + >0/2h     urgent >10/10m   (retuned 07-24)
  #   Garage fridge         warn >42/20m            urgent >45/10m
#     plus CUMULATIVE >2h/4h/6h above 40F per 24h (frzmon_danger_zone_cumulative,
#     2026-08-03) — the >40/2h continuous line was removed because a cycling unit
#     never sustains it; see the note at the trigger.
  #     >42 catches a fast rise; >40-for-2h catches a stuck-at-41 drift. Both sit
  #     inside the USDA <=40-for-2h food-safety line. 43°F was actually seen 07-16.
  #   Kitchen fridge        warn >40/10m            urgent >45/10m   (unchanged; quiet)
  #   Garage fridge-freezer warn >10/45m            urgent >15/35m
  #     Defrost sustains <=27m above 10°F and <=20m above 15°F, so the long `for`
  #     filters it. The LOW absolute thresholds are kept on purpose: raising them
  #     to >25/>32 would be fail-deadly — a real failure that plateaus in the
  #     10-25°F band would never trip, and >32 only alerts at the food-melt line.
  #   Outdoor kitchen fridge: OMITTED until the ESPHome unit lands (was disabled).
  # ============================================================================
  - id: frzmon_temp_alerts
    alias: "Freezer monitor — temperature alerts (all units)"
    mode: parallel
    max: 20
    trigger:
      # RETUNED 2026-07-24 (Chris): the old warn >-5/20m became pure noise after the
      # unit stepped +10°F on 07-23 14:33Z (the battery-swap morning) — 93.6% of the
      # following 48h sat above -5 (band min -13.5 / max -1.7 / median -2.2), so warn
      # fired 3x and re-fired on every restart. Replaced with the SAME two-line shape
      # proven on the garage fridge (>42/20m + >40/2h, the latter since replaced by a
# cumulative counter) so raising the noisy line does
      # NOT go fail-deadly: >5/30m catches a fast rise, >0-for-2h catches a slow
      # failure that plateaus just above the USDA 0°F freezer line. Urgent unchanged.
      # ⚠️ OPEN: the +10°F step is UNEXPLAINED (probe repositioned during the swap vs
      # unit genuinely running warmer). Physical check still owed; re-baseline after.
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_freezer_temperature,        above: 0,  for: { hours: 2 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_freezer_temperature,        above: 5,  for: { minutes: 30 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.garage_freezer_temperature,        above: 10, for: { minutes: 10 } }
      # RETUNED 2026-07-31 for the back-of-top-shelf probe. 42/40/45 were set against a
      # DOOR-mounted sensor and the two positions differ by ~10°F at the same dial, so
      # they had become nearly unreachable: three settled nights read 23.9-25.3 floor,
      # 28.2-29.1 mean, 33.1 defrost-free ceiling.
      # The binding constraint is the fridge-freezer's auto-defrost, which warms this
      # probe too. Measured dwell above each candidate line across the three known
      # episodes (peaks 37.0 / 35.8 / 35.2):
      #     >34°F: 24.2 / 16.3 / 12.4 min     >36°F: 9.3 / 0 / 0 min
      #     >38°F: 0 / 0 / 0 min              >40°F: 0 / 0 / 0 min
      # So >36 with a 30-min gate clears the worst observed defrost by 3.2x, while >34
      # was rejected: 24.2 min of dwell leaves only ~6 min of margin, and a longer
      # defrost would page falsely. The 2h line sits at 34 because no defrost can hold
      # 34°F for two hours (worst was 24 min), so it catches a slow creep that the
      # 30-min line rides out. Urgent 45 -> 42: nothing normal, defrost included, has
      # exceeded 37.
      # ⚠️ This probe reads the COLDEST zone in the box. Door-bin temperature runs ~10°F
      # warmer, so >36 here means roughly 46 where food actually sits — a good FAILURE
      # detector, a poor food-safety thermometer. A second probe is the only real fix.
      # ⏸️ HELD WIDE 2026-07-31 17:36, HOURS AFTER BEING TIGHTENED — read this before
      # "fixing" it. The 36/30m + 34/2h + 42/10m set was correct and measured, but it was
      # measured for the BACK OF THE TOP SHELF, and Chris is moving the probe to a central
      # position. Nothing in the fridge was freezing, so the 23.9°F floor was a genuine
      # cold-spot reading rather than a food problem, and the dial stays at max-1.
      # A central position sits between the two extremes already measured — back ~29°F
      # mean, door ~39°F — so it should land somewhere near 33-35. Against that, a warn at
      # 36 with a 30-minute gate would page within hours of the move, all night, for a
      # perfectly healthy box. So these revert to the pre-move numbers, which are loose
      # for any position but still catch a genuine failure (a dead box drifts to garage
      # ambient, far past 45).
      # The tight set is NOT lost — it is recorded in commit 2a32658 along with the dwell
      # measurements behind it, and the same method re-runs once the new position has three
      # settled nights: defrost dwell above each candidate line, then the longest
      # continuous non-defrost run, then pick the line with >=3x margin.
      # ⚠️ The defrost coupling may also weaken — a central probe sits further from the
      # shared evaporator than the back one did, so re-measure the bump before assuming
      # the old 35-37°F excursions still apply.
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_fridge_temperature,         above: 42, for: { minutes: 20 } }
      # REMOVED 2026-08-03: `above: 40, for: { hours: 2 }`. The NUMBER was right — 40°F is
      # the USDA line — but the SHAPE could not do the job. A `for:` gate needs an unbroken
      # breach, and this unit cycles across its own line every 10-20 min (~70 resets on
      # 07-28 alone). Measured consequence: 07-27 logged 217.4 min above 40°F in one day
      # with a longest continuous run of 69.7 min, so this trigger never matured on a day
      # that exceeded the USDA CUMULATIVE limit by nearly 2x. Replaced by
      # frzmon_danger_zone_cumulative below, which counts total minutes over 24h and is
      # therefore immune to cycling. The >42/20m and >45/10m lines stay exactly as they
      # were — they cover sharp excursions and are unaffected by this.
      - { platform: numeric_state, id: urgent, entity_id: sensor.garage_fridge_temperature,         above: 45, for: { minutes: 10 } }
      # 40/10m -> 42/20m (2026-08-03, Chris). The old line was a DOOR-OPENING pager: it
      # fired 08-01 20:44Z exactly 10 min into a 47.5-min loading excursion that peaked
      # 40.6°F, which is precisely the alert he asked not to get. Door events on this
      # unit peak ~40.6 and run under 20 min, so 42/20m clears them; genuine 40°F dwell
      # is now caught by the cumulative danger-zone counter instead, and >45/10m still
      # catches a fast failure. Cost: ~10 min later warning on a sharp excursion.
      - { platform: numeric_state, id: warn,   entity_id: sensor.kitchen_fridge_temperature,        above: 42, for: { minutes: 20 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.kitchen_fridge_temperature,        above: 45, for: { minutes: 10 } }
      - { platform: numeric_state, id: warn,   entity_id: sensor.garage_fridge_freezer_temperature, above: 10, for: { minutes: 45 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.garage_fridge_freezer_temperature, above: 15, for: { minutes: 35 } }
      # Outdoor kitchen fridge (ESPHome probe) — baseline ~45F, transparent door in
      # direct afternoon sun. INITIAL warn 50 / urgent 57 (2026-07-23, per Chris);
      # nightly range-check tunes these off the observed daily band.
      # RETUNED 2026-07-27 (Chris: "update to whatever is sane lately"). The old 50/57
      # lines were set blind at adoption. Four days of live data show this unit tracks the
      # WEATHER, not a fault: daily maxima climbed 48.5 -> 49.4 -> 53.5 -> 55.4°F (ambient
      # hit 87°F) while the daily FLOOR held at 33.0-34.6°F. A unit that still pulls down
      # to 34 is not failing, so >50 was firing truthfully but un-actionably.
      # New lines sit above the observed weather envelope: warn 58 (max seen 55.4),
      # urgent 65 (clearly abnormal). Real failure detection is NOT these — it is
      # frzmon_outdoor_pulldown (24h floor), which weather cannot trip.
      # ⚠️ RE-CHECK IN AUGUST: at ambient ~100°F a healthy box in direct sun could push
      # past 58. If that starts firing on hot afternoons, raise it again — do NOT touch
      # the 24h floor, that one is the actual health signal.
      # RETUNED AGAIN 2026-07-30: the probe was moved DEEPER into the box on 07-28
      # ~17:00, which removed the afternoon sun ramp from the signal entirely. The
      # first post-move sun window (07-29 13:00-18:00) peaked at 36.5°F against 57.1
      # and 55.4 on the two days before it, and two consecutive overnight windows agree
      # to 0.3°F (floors 31.3 / 31.5). Against a 36.6°F ceiling the old 58/65 lines
      # could never fire at all. 48/55 is deliberately INTERIM and wider than the
      # observed band: only ONE post-move afternoon has been sampled, at unknown
      # ambient severity, and a dead box drifts toward ambient anyway — so this catches
      # failure with near-identical latency while surviving an unsampled 95°F day.
      # Tighten toward 44/50 at the 08-01 review if three days including a genuinely
      # hot afternoon stay at or below ~38-40.
      # TIGHTENED 2026-07-31, the review the 48/55 interim was staged for. The condition
      # was three settled days including a genuinely hot afternoon: floors agree to 0.6°F
      # (31.3 / 31.5 / 31.5), and 07-29 peaked at just 36.5°F while ambient ran 86-91°F.
      # True post-move ceiling across all hours is 39.4°F, so 44 keeps ~4.6°F over the
      # observed maximum and the 30-min gate rides out any brief excursion.
      - { platform: numeric_state, id: warn,   entity_id: sensor.outdoor_kitchen_fridge_temperature, above: 44, for: { minutes: 30 } }
      - { platform: numeric_state, id: urgent, entity_id: sensor.outdoor_kitchen_fridge_temperature, above: 50, for: { minutes: 10 } }
    variables:
      names:
        sensor.garage_freezer_temperature: "Garage freezer"
        sensor.garage_fridge_temperature: "Garage fridge"
        sensor.kitchen_fridge_temperature: "Kitchen fridge"
        sensor.garage_fridge_freezer_temperature: "Garage fridge-freezer"
        sensor.outdoor_kitchen_fridge_temperature: "Outdoor kitchen fridge"
    action:
      - variables:
          n: "{{ names[trigger.entity_id] | default(trigger.entity_id) }}"
          crit: "{{ trigger.id == 'urgent' }}"
      - action: script.frzmon_notify
        data:
          critical: "{{ crit }}"
          title: "{{ ('🚨 ' ~ n ~ ' FAILING') if crit else ('⚠️ ' ~ n ~ ' warming') }}"
          message: "{{ n }} is {{ trigger.to_state.state | float | round(1) }}°F (sustained over {{ trigger.above }}°F){{ ' — check it now' if crit else '' }}."

  # ---- Rate-of-rise (door-ajar / slow-failure early warning) — all units, one automation ----
  # Each *_rising trend binary_sensor fires this; the condition gates it BELOW that
  # unit's warn line so it never double-fires with the absolute warn above. Per-unit
  # temp sensor + warn line + friendly name come from the lookup dicts.
  - id: frzmon_rising_alerts
    alias: "Freezer monitor — steadily warming (all units)"
    mode: parallel
    max: 20
    trigger:
      - { platform: state, entity_id: binary_sensor.garage_freezer_rising,        to: "on", for: { minutes: 5 } }
      - { platform: state, entity_id: binary_sensor.garage_fridge_rising,         to: "on", for: { minutes: 20 } }
      - { platform: state, entity_id: binary_sensor.kitchen_fridge_rising,        to: "on", for: { minutes: 20 } }
      - { platform: state, entity_id: binary_sensor.garage_fridge_freezer_rising, to: "on", for: { minutes: 20 } }
      # RE-ARM (2026-07-30). Without this the defrost suppression below can swallow a
      # real alert: if the garage fridge's rising `for: 20m` matures INSIDE the
      # suppression window, the only trigger it ever gets is consumed and nothing fires
      # again even though the fridge keeps warming. So when the defrost flag clears,
      # re-evaluate — the shared conditions require the fridge to still be rising.
      # `for:` here is load-bearing, not cosmetic: the freezer reports every ~31s, so one
      # sample chattering across the 10°F line mid-defrost would read as "defrost over",
      # re-arm, and fire exactly the mid-defrost push this suppression exists to kill.
      # Also absorbs the unknown->off edge at entity creation.
      #
      # 3m -> 30m (2026-08-02). This MUST stay equal to the post-defrost tail in the
      # suppression condition below, and the two only work as a pair. The tail was added
      # because the old gate lifted the instant the flag went off, so a `for: 20m` that
      # matured just after it sailed straight through — which is exactly what happened on
      # 08-01: defrost ran 19:30->19:57, rising armed at 19:39, matured at 19:59, and the
      # push went out two minutes after the gate released. Extending the tail alone would
      # NOT have fixed it: this re-arm fires at flag-off + `for:`, so at 3m it lands
      # inside a 30m tail and either gets suppressed too (nothing ever re-arms — the
      # swallowed-alert fail-deadly this trigger exists to prevent) or is exempted and
      # fires the same push one minute later. Moving both to 30m makes the re-arm land
      # exactly as the tail expires, where it re-checks whether the fridge is STILL
      # rising. On the 08-01 trace it is not (rising went off at 19:59), so no push.
      # COST, accepted, and it is worse than "30 min later" — state it honestly. For a
      # FAST event the rate alert is not delayed, it is lost. Door ajar at defrost onset,
      # ~9°F/hr from ~34°F: rising matures mid-defrost (suppressed), the re-arm fires at
      # flag-off + 30 ≈ onset + 55 min, and by then the probe reads ~42°F — above the
      # `warn_of` 40 gate in the first condition, which blocks the re-arm too. So the
      # rate alert for that event never fires at all and the first page is the >42/20m
      # absolute at ~onset + 70-75 min, against ~30 min under the old config. Not
      # fail-deadly (the absolute still pages) but the re-arm only ever re-evaluates
      # events still below 40°F — i.e. precisely NOT the fast ones.
      # ⚠️ Re-check this after the 08-03 threshold re-derivation: a LOWER warn line
      # widens the band in which `warn_of` blocks the re-arm.
      - { platform: state, entity_id: binary_sensor.garage_fridge_freezer_defrost, to: "off", id: defrost_cleared, for: { minutes: 30 } }
      # SECOND RE-ARM (2026-08-03), for the fridge-freezer itself. When the suppression
      # was extended to cover this unit, it inherited the same swallowed-alert exposure
      # the garage fridge has: a `for: 20m` maturing inside the window consumes the only
      # trigger it gets. Same entity, same `for:`, distinct id — both fire, and `mode:
      # parallel` runs each with its own `subject`, so they never interfere.
      - { platform: state, entity_id: binary_sensor.garage_fridge_freezer_defrost, to: "off", id: defrost_cleared_ff, for: { minutes: 30 } }
      # Outdoor kitchen fridge DROPPED from rate detection 2026-07-24: the probe reads
      # AIR, so its normal compressor cycle swings ~11°F (33↔44°F) every 45-90 min —
      # each warming limb (~12°F/hr for ~45 min) is indistinguishable from a door-ajar,
      # firing ~7-8 false "steadily warming" pushes/day. Rate+time can't separate the
      # two for this unit. Covered instead by the absolute warn and the 24h-floor detector.
      # Trend sensor kept for dashboard only.
      # ⚖️ RE-EXAMINED 2026-07-31 and STILL NOT RE-ADDED, now on a measurement rather than
      # a guess. The deeper probe damped the swing from ~11°F to ~5-6°F, which looked like
      # it might finally separate a real excursion from the compressor cycle — but the
      # steepest NATURAL 45-min warming limb since the move is 7.2°F/hr against a gate of
      # 8.0°F/hr. An 11% margin is not a detector, it is a coin flip, and raising the
      # gradient far enough to be safe would put it above what the absolute already
      # catches. The floor detector remains the real failure signal for this unit.
    variables:
      # The re-arm trigger fires on the DEFROST flag, not on a *_rising sensor, so it has
      # no entry in the lookups below. Map it back to the unit it speaks for; every other
      # trigger speaks for itself.
      subject: >-
        {% set tid = trigger.id | default('') %}
        {%- if tid == 'defrost_cleared' -%}binary_sensor.garage_fridge_rising
        {%- elif tid == 'defrost_cleared_ff' -%}binary_sensor.garage_fridge_freezer_rising
        {%- else -%}{{ trigger.entity_id }}{%- endif -%}
      temp_of:
        binary_sensor.garage_freezer_rising: sensor.garage_freezer_temperature
        binary_sensor.garage_fridge_rising: sensor.garage_fridge_temperature
        binary_sensor.kitchen_fridge_rising: sensor.kitchen_fridge_temperature
        binary_sensor.garage_fridge_freezer_rising: sensor.garage_fridge_freezer_temperature
      warn_of:
        # -5 -> 0 (2026-07-27): THIS WAS A BUG I INTRODUCED ON 07-24. When the garage
        # freezer's absolute warn was retuned from >-5 to >0/>5, this gate was left at -5.
        # The condition below only alerts when temp is BELOW the warn line (to avoid
        # double-firing with the absolute warn), so with the post-step band of -4.0..-2.9
        # EVERY garage-freezer rising alert was silently suppressed. Combined with the
        # max_samples window cap, that is why the 07-26 event (-3 -> +17.8°F) produced no
        # "steadily warming" alert at all — and the stale gate was the DOMINANT cause.
        # LESSON: retuning a threshold means auditing every OTHER place that mirrors it.
        binary_sensor.garage_freezer_rising: 0
        # 40 -> 36 (2026-07-31), mirroring the absolute warn retune above. Leaving this
        # at 40 while the absolute moved to 36 would have double-paged every excursion
        # between 36 and 40 (both alerts live at once). This is the same mirror that was
        # missed on 07-24 and silently killed every garage-freezer rate alert — when a
        # threshold moves, audit every other place that copies it.
        # Back to 40 with the absolute warn above (2026-07-31 17:36). The mirror moves in
        # BOTH directions: tightening and loosening each require the same audit.
        # 40 -> 42 (2026-08-03), because the >40/2h absolute this mirrored NO LONGER
        # EXISTS — it was replaced by the cumulative danger-zone counter, leaving >42/20m
        # as the lowest absolute on this unit. The rule is that warn_of tracks the
        # short-`for` warn line so the rate alert never double-fires with the absolute
        # that OWNS a band; with nothing absolute living in 40-42 any more, leaving this
        # at 40 would have silently suppressed rate alerts and post-defrost re-arms
        # across a 2°F band that nothing else watches on a fast timescale. Conservative
        # either way (40 mutes, 42 restores), but it must be DECIDED, not inherited.
        binary_sensor.garage_fridge_rising: 42
        # 40 -> 42 (2026-08-03), mirroring the kitchen absolute warn retune in the same
        # commit. THIS IS THE AUDIT STEP THAT HAS BEEN MISSED TWICE ON THIS BOX (07-24
        # silently killed every garage-freezer rate alert; 07-31 caught it only in
        # review). Leaving this at 40 while the absolute moved to 42 would suppress
        # rate alerts across a 40-42 band that no absolute owns any more.
        binary_sensor.kitchen_fridge_rising: 42
        binary_sensor.garage_fridge_freezer_rising: 10
      names:
        binary_sensor.garage_freezer_rising: "Garage freezer"
        binary_sensor.garage_fridge_rising: "Garage fridge"
        binary_sensor.kitchen_fridge_rising: "Kitchen fridge"
        binary_sensor.garage_fridge_freezer_rising: "Garage fridge-freezer"
    condition:
      - condition: template
        value_template: "{{ states(temp_of[subject]) | float(999) < (warn_of[subject] | float) }}"
      # ⚠️ RESTORED-STATE GUARD (2026-07-27). Trend binary_sensors RESTORE their previous
      # on/off state across a restart, before they have collected any samples. HA writes
      # that restored state at startup, which registers as a transition TO "on" and arms
      # this automation's `for:` timer — so every restart can produce a spurious "steadily
      # warming" push minutes later, off a trend that has not actually measured anything.
      # Observed live: right after the 00:17Z restart, garage_freezer_rising read `on` with
      # sample_count=2 against its min_samples=5. It also explains the 07-24 21:40 alert,
      # 22 min after that restart. `sample_count` >= 5 is >= the max min_samples of all
      # units here, so a restored/refilling deque cannot satisfy it — only a genuinely
      # computed trend can. (This artifact was previously masked by the stale warn_of gate
      # above; fixing that gate without adding this guard would have armed it.)
      - condition: template
        value_template: "{{ state_attr(subject, 'sample_count') | int(0) >= 5 }}"
      # ⚠️ DEFROST SUPPRESSION — TIME-BOUNDED ON PURPOSE (2026-07-30, garage fridge only).
      # A plain "skip while the freezer is above 10°F" gate would be FAIL-DEADLY: an
      # appliance that genuinely dies parks the freezer above 10°F indefinitely and the
      # fridge's rate alert would be muted exactly when it matters. So the gate only holds
      # while the defrost is both ACTIVE and YOUNG. Measured time above 10°F has never
      # exceeded ~25 min (24.8 last night) across six episodes, so 60 min is ~2.4x the
      # envelope; past that the gate self-lifts. Backstop either way: the freezer's own
      # absolute warn (>10°F for 45m) has already paged before the gate expires.
      #
      # ➕ POST-DEFROST TAIL, 30 min (2026-08-02). As first shipped this gate released the
      # instant the flag went off, and the cabinet is still hot for a good while after
      # that — so a `for: 20m` maturing just past the release fired anyway. It did, on
      # 08-01 at 19:59, two minutes after the 19:57 release. In the two defrosts since
      # deploy this gate suppressed nothing — though with only two episodes on record,
      # one of which needed no suppression, that is weak evidence either way rather than
      # an indictment of the gate.
      # Sizing: measured time for the fridge to fall back under 36°F after the flag
      # clears is +20 min (08-01) and +12 min (08-02), so 30 min is 1.5-2.5x. ⚠️ But the
      # variable that actually governs a re-arm false push is not that one — it is how
      # long `garage_fridge_rising` STAYS ON past flag-off, and that is n=1: 2m17s on
      # 08-01, while on 08-02 rising never armed at all (the mid-shelf probe damped the
      # limb below the 8°F/hr gate). The margin looks wide, 2.3 min against 30, on one
      # sample. Re-measure over the next 4-6 defrosts: if any episode has rising still on
      # at flag-off + 30 with >= 20 min of on-time, the re-arm fires and the tail is
      # undersized.
      # Still NOT fail-deadly, for two independent reasons: the tail only applies while
      # the flag reads 'off' — a dead appliance parks it 'on', where the unchanged 60-min
      # bound self-lifts — and the tail is itself time-bounded, with the `defrost_cleared`
      # re-arm firing at exactly its expiry to re-evaluate. That trigger is exempted here
      # so the two can never race at the 1800s boundary.
      # ⚠️ KNOWN DEGRADATION, bounded by physics rather than by construction: a sustained
      # square wave across the 10°F line (flag on <60 min, off <30 min, repeating) keeps
      # one suppression branch alive indefinitely AND resets the re-arm's `for: 30m` on
      # every on-transition, so it never matures — muting this unit's rate alert for as
      # long as the oscillation lasts. The old design degraded here instead of fully
      # muting. It needs a pathological appliance, and the fridge's other coverage stays
      # live throughout — absolutes 42/20m and 45/10m, plus the cumulative danger-zone
      # counter and the 24h floor — so this is accepted knowingly.
      # (Updated 2026-08-03: this argument used to cite >40/2h, which no longer exists.)
      # ⚠️ Restart side effect: the flag is recreated unknown->off at boot, so its
      # last_changed is the boot stamp and every HA restart imposes a 30-min tail on this
      # unit's rate alert (and schedules a defrost_cleared at boot+30m, which condition 4
      # blocks). Largely masked by the sample_count >= 5 restart guard above.
      # 🛑 WHAT THIS DOES NOT FIX (measured 08-01 23:53 CDT): the shared-cabinet coupling
      # also fires when the freezer warms WITHOUT crossing 10°F — the fridge probe climbed
      # 28.9->35.6°F at ~9.3°F/hr with the flag off for 3.9h, and paged. The >10°F flag is
      # a proxy for "defrost", but the real falsing mechanism is freezer-side heat in the
      # shared cabinet, which happens sub-threshold too. No tail can suppress that class.
      # A proxy keyed on freezer RATE rather than level would — that is a design decision,
      # deliberately not bolted on here.
      # ➕ EXTENDED 2026-08-03 to cover the fridge-freezer itself. Its rate gate was
      # re-fitted 12.6 -> 27 F/hr in the same commit, which kills the cycling noise but
      # CANNOT stop the defrost: that ramp sustains 28.9-32 min above 27 F/hr against a
      # 20-min timer, and no gate value fixes it (35 F/hr still sustains 25.8 min). So
      # the unit that DEFINES the defrost flag now also honours it.
      # ⚠️ BE PRECISE ABOUT WHY THIS IS SAFE — the obvious argument is WRONG. "The 60-min
      # bound self-lifts" does NOT rescue this unit: a self-lifting CONDITION cannot
      # resurrect a TRIGGER that was already consumed. A slow failure that crosses 10°F
      # eats the ff rising trigger inside the suppression window, and the re-arm (flag ->
      # off, 30m) never arrives on a unit whose flag is stuck on — so the ff RATE path is
      # structurally lost for exactly that event. This is only acceptable because the
      # rate path is not the backstop: the unit's own absolutes (>10/45m and >15/35m)
      # own the dead-appliance case and page well before the rate alert would have
      # mattered. Do not "fix" this by unbounding the gate — the absolutes are the
      # guarantee, and the suppression exists solely to stop defrost false alarms.
      - condition: template
        value_template: >-
          {{ subject not in ['binary_sensor.garage_fridge_rising',
                             'binary_sensor.garage_fridge_freezer_rising']
             or trigger.id | default('') in ['defrost_cleared', 'defrost_cleared_ff']
             or not (
                  (is_state('binary_sensor.garage_fridge_freezer_defrost', 'on')
                   and (now() - states.binary_sensor.garage_fridge_freezer_defrost.last_changed).total_seconds() < 3600)
                  or
                  (is_state('binary_sensor.garage_fridge_freezer_defrost', 'off')
                   and (now() - states.binary_sensor.garage_fridge_freezer_defrost.last_changed).total_seconds() < 1800)
                ) }}
      # A re-arm must not fire on a unit that has since stopped warming. Keyed on
      # `subject` rather than a hardcoded entity so it covers both re-arm triggers.
      - condition: template
        value_template: >-
          {{ trigger.id | default('') not in ['defrost_cleared', 'defrost_cleared_ff']
             or (is_state(subject, 'on')
                 and (now() - states[subject].last_changed).total_seconds() >= 1200) }}
    action:
      - variables:
          n: "{{ names[subject] }}"
          t: "{{ temp_of[subject] }}"
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📈 {{ n }} steadily warming"
          message: "{{ n }} is warming steadily, now {{ states(t) | float | round(1) }}°F — door ajar or failing?"

  # ---- REMOVED 2026-07-27: frzmon_outdoor_plateau (3h-mean > 44°F for 30m) ----
  # Deleted, not retuned, because it measured the WEATHER rather than the appliance.
  # It fired 4x in two days (07-26 22:15, 07-27 01:50 / 19:23 / 20:46) — every one of
  # them truthful and none of them actionable: the 3h mean tracked ambient (87°F outside,
  # daily maxima 48.5 -> 55.4°F over four days) while the unit's daily FLOOR never moved
  # off 33.0-34.6°F. A box that still pulls down to 34 is not failing. Raising the line
  # instead of removing it would just re-create the same noise one heat wave later, and
  # the 44-vs-45-47 "baseline reconciliation" this entry used to demand was chasing
  # weather all along — that question is now CLOSED.
  # The gap it was meant to cover (a slow drift plateauing in the 44-49°F band) is now
  # covered properly by frzmon_outdoor_pulldown below, which watches the 24h FLOOR — the
  # one signal a heat wave cannot fake. sensor.outdoor_kitchen_fridge_3h_mean is KEPT for
  # the dashboard; nothing triggers on it anymore.

  # ---- Outdoor kitchen fridge: PULL-DOWN FAILURE (2026-07-27) ----
  # Fires only if the unit fails to reach 40°F at ANY point in 24h — i.e. it has lost
  # the ability to pull down at all. Deliberately insensitive to ambient: the peaks and
  # the 3h mean both climb with the weather (07-27 max hit 55.4 and the 3h mean 51.6,
  # tripping the >50 warn and the >44 plateau truthfully but un-actionably), while the
  # daily FLOOR held at 33.9. This is the complement to those two: they say "it's warm",
  # this says "it's broken". Threshold 40 leaves ~5°F of headroom over the observed
  # floor. Low stakes per Chris — this unit only stores water, no food-safety exposure.
  - id: frzmon_outdoor_pulldown
    alias: "Freezer monitor — outdoor kitchen fridge not pulling down (24h floor)"
    mode: single
    trigger:
      # 40 -> 36 (2026-07-30): the deeper probe lowered the healthy floor from
      # 33.5-34.7 to 30.4-31.5. The old line kept 5.5-6.5°F of headroom over the floor,
      # so the equivalent is 36-37 — and 40 is now so far above the floor it would only
      # catch a total failure. 34 was rejected: the OLD healthy floor sat above it, so a
      # heat-wave brush with 34 is plausible without anything being broken.
      - platform: numeric_state
        entity_id: sensor.outdoor_kitchen_fridge_24h_min
        above: 36
        for: { minutes: 60 }
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "🧊 Outdoor kitchen fridge not cooling down"
          message: "Outdoor kitchen fridge has not gotten below {{ states('sensor.outdoor_kitchen_fridge_24h_min') | float | round(1) }}°F in 24h (healthy floor is ~31°F). It is failing to pull down — compressor or door seal, not just hot weather."

  # ============================================================================
  # CUMULATIVE DANGER-ZONE EXPOSURE (2026-08-03) — the food-safety instrument.
  # ============================================================================
  # Chris, 08-03: "are the existing temp thresholds healthy or do we need to lower them
  # for food safety concerns? I don't want a warning any time a door is opened, I want
  # warnings when there is, or could be, a problem."
  # The answer was that the LINES were right and the SHAPE was wrong. USDA counts
  # CUMULATIVE time in the 40-140°F danger zone, but every `above/for` gate on this box
  # demands an unbroken breach, which a cycling fridge never delivers. Measured on the
  # garage fridge, 07-27: 217.4 min above 40°F across the day, longest continuous run
  # 69.7 min, `>40 for 2h` never matured. This counts minutes instead.
  # 2h = the USDA discard line. FALSE-ALARM CHECK across 7 days: the kitchen fridge's
  # worst day was 48.6 min (2.5x margin) and the garage fridge post-move is 0.0 min, so
  # ordinary door openings — single-digit minutes each — cannot approach it. That is
  # what makes this satisfy "not every time a door is opened".
  # NOT critical: by the time this fires the exposure has already happened, so it is a
  # "check your food" message, not a wake-up. The sharp lines (>42/20m, >45/10m on the
  # garage fridge, >45/10m on the kitchen) remain the fast-failure alarms.
  - id: frzmon_danger_zone_cumulative
    alias: "Freezer monitor — cumulative time in the danger zone (24h)"
    mode: parallel
    max: 10
    # ⚠️ TIERED ON PURPOSE — a single `above: 2` LATCHES and opens a worse gap than the
    # trigger this replaced. `numeric_state` fires on CROSSING only, and once a bad
    # cycling day pushes the counter past 2h it stays there for ~24h. If the compressor
    # then quits inside that window and the box parks at 41°F, there is no re-crossing to
    # fire on, 41°F never reaches >42/20m or >45/10m, and the 24h floor needs ~24-25h to
    # notice — while the removed `>40 for 2h` would have paged in two hours. That
    # sequence is not a coincidence either; a day of excursions followed by a plateau is
    # what a dying appliance actually looks like.
    # A plateau accumulates 1 min/min, so the 4h and 6h tiers re-page ~2h apart and
    # restore the old latency. `for: 5m` stops a counter hovering exactly on a line from
    # chattering out repeated pushes — deliberately NOT a shared cooldown, which would
    # let one fridge's page mute the other's for an hour.
    trigger:
      - { platform: numeric_state, entity_id: sensor.garage_fridge_hours_above_40f_24h,  above: 2, for: { minutes: 5 }, id: garage_fridge }
      - { platform: numeric_state, entity_id: sensor.garage_fridge_hours_above_40f_24h,  above: 4, for: { minutes: 5 }, id: garage_fridge }
      - { platform: numeric_state, entity_id: sensor.garage_fridge_hours_above_40f_24h,  above: 6, for: { minutes: 5 }, id: garage_fridge }
      - { platform: numeric_state, entity_id: sensor.kitchen_fridge_hours_above_40f_24h, above: 2, for: { minutes: 5 }, id: kitchen_fridge }
      - { platform: numeric_state, entity_id: sensor.kitchen_fridge_hours_above_40f_24h, above: 4, for: { minutes: 5 }, id: kitchen_fridge }
      - { platform: numeric_state, entity_id: sensor.kitchen_fridge_hours_above_40f_24h, above: 6, for: { minutes: 5 }, id: kitchen_fridge }
    variables:
      names:
        garage_fridge: "Garage fridge"
        kitchen_fridge: "Kitchen fridge"
      temp_of:
        garage_fridge: sensor.garage_fridge_temperature
        kitchen_fridge: sensor.kitchen_fridge_temperature
      n: "{{ names[trigger.id] }}"
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "🌡️ {{ n }} — 2h+ above 40°F today"
          message: "{{ n }} has spent {{ (states(trigger.entity_id) | float * 60) | round(0) }} minutes above 40°F in the last 24h (now {{ states(temp_of[trigger.id]) | float | round(1) }}°F). That is the USDA discard line for refrigerated food — check contents and the door seal."

  # ============================================================================
  # 24h FLOOR — the early-warning trend layer for the two FOOD fridges (2026-08-03)
  # ============================================================================
  # This is the "trend that indicates a problem might be coming" Chris asked for. A
  # refrigerator loses the ability to PULL DOWN before it loses the danger zone, so the
  # floor rises first — days before any absolute line is threatened. Peaks and means
  # track weather and door usage; the floor tracks the appliance. That principle was
  # established on this system by the outdoor unit (stable floor 33.0-34.6 while daily
  # maxima climbed 48.5 -> 55.4, which correctly read as heat load, not failure).
  # Until now no FOOD unit had one — only the water-only outdoor fridge did.
  # Lines set by the same method as frzmon_outdoor_pulldown: ~4.5-6°F of headroom over
  # the measured healthy floor.
  #   garage fridge  floors 32.0 / 33.6 post-move (mid-shelf probe)  -> 38
  #   kitchen fridge floors 30.7-33.6 over 8 days                    -> 38
  # ⚠️ THE GARAGE FRIDGE LINE RESTS ON ONLY TWO POST-MOVE DAYS and its floor is still
  # trending up as baseline #5 settles (32.0 -> 33.6). Re-check it after a few more
  # days; if the floor stabilises above ~34 this needs to move up, and a floor that
  # keeps climbing is itself the signal this alert exists to catch.
  - id: frzmon_fridge_floor
    alias: "Freezer monitor — fridge not pulling down (24h floor)"
    mode: parallel
    max: 10
    trigger:
      # GARAGE AT 40, not 38 (Chris's call 2026-08-03): its floor is still climbing as
      # baseline #5 settles (32.0 -> 33.6 in two days) and a 38 line risked paging around
      # 08-06 with nothing wrong. 40 buys headroom through the settling period.
      # Semantics worth keeping straight: at 40 this reads "the box never got below the
      # USDA line at ANY point in 24h", which is an unambiguous failure statement — but
      # it is a LATER warning than the ~4.5-6°F-over-floor rule used for the outdoor unit
      # and the kitchen. ⚠️ Revisit once the floor stabilises; if it settles ~34, the
      # equivalent early line is ~38-39 and this should come back down.
      - platform: numeric_state
        entity_id: sensor.garage_fridge_24h_min
        above: 40
        for: { minutes: 60 }
        id: garage_fridge
      - platform: numeric_state
        entity_id: sensor.kitchen_fridge_24h_min
        above: 38
        for: { minutes: 60 }
        id: kitchen_fridge
    variables:
      names:
        garage_fridge: "Garage fridge"
        kitchen_fridge: "Kitchen fridge"
      floors:
        garage_fridge: "~32-34°F"
        kitchen_fridge: "~31-33°F"
      n: "{{ names[trigger.id] }}"
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📉 {{ n }} losing its pull-down"
          message: "{{ n }} has not been below {{ states(trigger.entity_id) | float | round(1) }}°F at any point in 24h (healthy floor {{ floors[trigger.id] }}). Nothing is spoiled yet — this is the early sign the box is starting to struggle. Worth checking the coils, seal and how full it is."

  # ===================== OFFLINE (no reading) =====================
  # `for` widened 1m -> 15m to ride out brief WiFi/reception gaps; a genuinely dead
  # sensor still flags after ~25m. Tower/B (garage chest freezer) stays IN — its
  # multi-hour dropouts are a real "failing / out of range" signal, not noise.
  # Outdoor kitchen fridge RE-ADDED 2026-07-23: now on the reliable ESPHome/WiFi
  # unit (was dropped while on the marginal 433 link). This offline alert is the
  # ONLY silent-death guard for it — the ESPHome unit is USB-powered so it has no
  # battery alert, and unavailable temp can't fire the numeric/rising triggers.
  - id: frzmon_sensor_offline
    alias: "Freezer monitor — sensor offline"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - sensor.garage_freezer_temperature
          - sensor.garage_fridge_temperature
          - sensor.kitchen_fridge_temperature
          - sensor.garage_fridge_freezer_temperature
          - sensor.outdoor_kitchen_fridge_temperature
        to: "unavailable"
        for: { minutes: 15 }
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📡 Fridge/freezer sensor offline"
          message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} — no reading for ~25 min (battery/range?)."

  # ===================== LOW BATTERY =====================
  - id: frzmon_sensor_low_battery
    alias: "Freezer monitor — low battery"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.garage_freezer_sensor_battery
          - binary_sensor.garage_fridge_sensor_battery
          - binary_sensor.kitchen_fridge_sensor_battery
          - binary_sensor.garage_fridge_freezer_sensor_battery
        to: "on"
        for: { minutes: 5 }
    action:
      - action: script.frzmon_notify
        data:
          importance: default
          title: "🔋 Fridge/freezer sensor low battery"
          message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} reports low battery — swap in lithium AAs."

  # ===================== PER-UNIT STALENESS SWEEP (2026-07-24) =====================
  # Restart-proof, per-unit silent-death guard. Closes TWO independent gaps that
  # frzmon_sensor_offline (above) cannot:
  #   1. That automation is TRANSITION-ONLY (`to: "unavailable"` + for: 15m). Pending
  #      `for:` timers do not survive a restart/reload, and HA does not re-fire a
  #      state trigger against an already-matching state — so a sensor that dies just
  #      before or during a restart is NEVER reported. This is the identical bug fixed
  #      in the water-leak watchdog on 2026-07-06 by adding a time sweep; the freezer
  #      stack never got that treatment. It is also the ONLY silent-death guard for
  #      the ESPHome outdoor unit (see lines 396-399), so that unit was exposed too.
  #   2. A single dead 606 never expires at all, because expire_after is re-armed by
  #      the SIBLING 606's messages on the shared topic (lines 104-107).
  # Judged off the per-unit *_last_seen stamps, NOT off `unavailable`, and NOT off
  # last_reported (which FREEZES on identical MQTT payloads — that trap caused a
  # false "dead sensor" alarm on 2026-07-24). The outdoor unit is ESPHome/native-API,
  # where an unchanged write DOES advance last_reported, so it uses that instead.
  # 433 units transmit every ~6-25s, so 25 min is 60+ missed messages — clear of the
  # known RF burst gaps while still well inside food-safety timescales.
  - id: frzmon_staleness_sweep
    alias: "Freezer monitor — per-unit staleness sweep"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    variables:
      max_age_min: 25
      units:
        - { name: "Garage freezer",         seen: "sensor.garage_freezer_last_seen",        temp: "sensor.garage_freezer_temperature" }
        - { name: "Garage fridge",          seen: "sensor.garage_fridge_last_seen",         temp: "sensor.garage_fridge_temperature" }
        - { name: "Kitchen fridge",         seen: "sensor.kitchen_fridge_last_seen",        temp: "sensor.kitchen_fridge_temperature" }
        - { name: "Garage fridge-freezer",  seen: "sensor.garage_fridge_freezer_last_seen", temp: "sensor.garage_fridge_freezer_temperature" }
        # ESPHome/native API — no MQTT topic, so fall back to last_reported (valid here).
        - { name: "Outdoor kitchen fridge", seen: "",                                       temp: "sensor.outdoor_kitchen_fridge_temperature" }
      # Trigger-based template sensors do NOT restore across a restart — they start
      # `unknown` until their first message. A unit that is DEAD at restart time
      # therefore has no stamp, and (if it is a 606 whose sibling still transmits)
      # its temp entity is NOT unavailable either — which would re-open the very hole
      # this sweep exists to close. So a missing stamp counts as STALE, guarded by a
      # 10-minute boot grace so a healthy fleet (stamps land within ~30s of MQTT
      # connecting) can't produce a spurious alert right after a restart/reload.
      # Deliberately fail-LOUD: worst case is one nuisance push, never a silent death.
      stale: >-
        {% set ns = namespace(items=[]) %}
        {% set me = states.automation.freezer_monitor_per_unit_staleness_sweep %}
        {% set boot_grace = me is none or (now() - me.last_changed).total_seconds() < 600 %}
        {% for u in units %}
          {% set t = states(u.temp) %}
          {% if t in ['unavailable', 'unknown'] %}
            {% set ns.items = ns.items + [u.name ~ ' (no reading)'] %}
          {% else %}
            {% set dt = none %}
            {% if u.seen %}
              {% set s = states(u.seen) %}
              {% if s in ['unknown', 'unavailable'] %}
                {% if not boot_grace %}
                  {% set ns.items = ns.items + [u.name ~ ' (no last-seen stamp)'] %}
                {% endif %}
              {% else %}
                {% set dt = s | as_datetime %}
              {% endif %}
            {% else %}
              {% set dt = states[u.temp].last_reported %}
            {% endif %}
            {% if dt is not none %}
              {% set age = ((now() - dt).total_seconds() / 60) | round | int %}
              {% if age > max_age_min %}
                {% set ns.items = ns.items + [u.name ~ ' (' ~ age ~ 'm silent)'] %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items | join(', ') }}
      # Self-diagnosing hint (2026-07-27). The two 606TX units share ONE 433 topic and one
      # decoder path, so WHICH of them is silent already tells you where the fault is —
      # the alert should say so rather than make someone re-derive it at 1am. Observed
      # twice in four days (07-24 17:13, and 07-26 23:40 -> 07-27 01:05, ~75-83 min each):
      # BOTH 606s dropped together while the Tower on a different topic held a 49s max
      # gap — i.e. receiver-side, not the sensors.
      hint: >-
        {% set k = 'Kitchen fridge' in stale %}
        {% set g = 'Garage fridge-freezer' in stale %}
        {%- if k and g %} BOTH 606 units went silent together — they share one 433 topic and one decoder, so this is almost certainly RECEIVER-side (SDR noise/interference), not two sensors failing at once. Check whether the Tower units are still reporting before touching any hardware.
        {%- elif k or g %} Only one of the two 606 units is silent, so the shared 433 receive path is fine — this points at that specific sensor (battery or placement).
        {%- endif %}
    condition:
      # `| trim` is deliberate, not decorative: the `stale` template is built from
      # {% %} control blocks, so it renders with surrounding whitespace. HA does strip
      # rendered results, but if that ever changed, a bare `| length > 0` would be
      # TRUE on every sweep and push an empty alert every 5 min. Trim makes it explicit.
      - condition: template
        value_template: "{{ stale | trim | length > 0 }}"
      # ⚠️ REPEAT SUPPRESSION (added 2026-07-27 — fixing MY bug). As first shipped this
      # sweep re-notified on EVERY 5-min pass for as long as anything was stale: the real
      # dual-606 outage on 07-27 00:05-01:05 produced 13 sweep fires (+2 from the
      # transition-based offline automation) = ~30 phone pushes in about an hour. That is
      # the exact alert fatigue the 17->4 consolidation existed to kill. The leak sweep
      # this was modeled on can't spam because it only runs 3x/day; this one runs 12x/hr.
      # Cooldown keyed on the automation's OWN last_triggered — which only advances when
      # the automation actually RUNS (i.e. when conditions passed and we notified), so it
      # is a true "last time we alerted" stamp and needs no helper entity. Conditions are
      # evaluated BEFORE the run, so this reads the PREVIOUS notification's time.
      # Every message already lists ALL currently-stale units, so a unit going stale
      # inside the cooldown is still reported on the next pass (<=1h later), and the
      # transition-based frzmon_sensor_offline covers new drops independently.
      # last_triggered resets to None on restart -> first post-restart alert is immediate
      # (fail-loud, deliberate).
      - condition: template
        value_template: >-
          {% set lt = state_attr('automation.freezer_monitor_per_unit_staleness_sweep', 'last_triggered') %}
          {{ lt is none or (now() - lt).total_seconds() > 3600 }}
    action:
      - action: script.frzmon_notify
        data:
          critical: false
          title: "📡 Fridge/freezer sensor silent"
          message: "No data from: {{ stale }} (>{{ max_age_min }} min silent).{{ hint }}"

# ---------------------------------------------------------------------------
# Shared notifier — sends to BOTH phones from one place (this replaced the
# duplicated iPhone+Pixel action pair in every one of the former 17 automations).
#   critical=true  -> "Critical Home Alerts" channel + iOS time-sensitive push
#   critical=false -> "Home Alerts" channel
#   importance      -> Android channel importance; defaults high, low-battery
#                      passes 'default' to stay a quiet/routine alert.
# ---------------------------------------------------------------------------
script:
  frzmon_notify:
    alias: "Freezer monitor — notify both phones"
    mode: parallel
    max: 20
    fields:
      title:
        description: "Notification title"
        example: "⚠️ Garage fridge warming"
      message:
        description: "Notification body"
        example: "Garage fridge is 42°F (sustained over 42°F)."
      critical:
        description: "Route to Critical Home Alerts + iOS time-sensitive"
        default: false
      importance:
        description: "Android importance: high or default"
        default: high
    sequence:
      # Defaults are applied HERE with Jinja `default()`, NOT via the `fields:`
      # `default:` keys above — HA does not reliably inject field defaults as
      # template variables, so an omitted `importance`/`critical` would render
      # empty and Android rejects an empty channel-importance (verified 2026-07-23).
      - variables:
          crit: "{{ critical | default(false) | bool }}"
          imp: "{{ importance | default('high') }}"
          chan: "{{ 'Critical Home Alerts' if crit else 'Home Alerts' }}"
          prio: "{{ 'high' if imp == 'high' else 'default' }}"
      - parallel:
          - action: notify.mobile_app_chriss_iphone
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data:
                channel: "{{ chan }}"
                importance: "{{ imp }}"
                priority: "{{ prio }}"
                ttl: 0
                push:
                  interruption-level: "{{ 'time-sensitive' if crit else 'active' }}"
          - action: notify.mobile_app_pixel_9_pro_xl
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data:
                channel: "{{ chan }}"
                importance: "{{ imp }}"
                priority: "{{ prio }}"
                ttl: 0
