# Airthings Renew purifier — TV-aware mode control via IFTTT webhooks.
#
# The Renew cannot be driven from HA directly: the core airthings integration is
# sensor-only, the public API has no write endpoints, and the unit refuses all
# 65535 TCP ports (cloud-only client). IFTTT is the only platform exposing Renew
# mode actions, so commands go out HA -> IFTTT -> Airthings cloud -> device.
#
# Manual speed 5 is the always-on state rather than boost because boost is a timed
# one-hour burst, while manual mode has no timer. Silent is also timed (8 hours),
# which the periodic re-assert keeps pushing out.
#
# Nothing reports the purifier's mode back to HA, so there is no state to guard on
# and every call is fired blind. The re-assert is the only thing that recovers a
# dropped webhook or a mode changed outside HA: every 30 minutes normally, every 5
# from 10pm to 1am, when Chris is in the room and a wrong mode is most noticeable.
#
# Full design and rationale: ~/homeassistant/docs/renew-purifier-ifttt-design.md

rest_command:
  renew_max:
    url: !secret ifttt_renew_max_url
    method: POST
    timeout: 20
  renew_quiet:
    url: !secret ifttt_renew_quiet_url
    method: POST
    timeout: 20

automation:
  - id: renew_tv_aware_purifier
    alias: Renew — TV-aware purifier
    description: >-
      Manual speed 5 whenever the master bedroom TV is off, silent mode while it is
      on, around the clock — unlike the night-noise automations there is no time
      window. Silent fires only on a real TV-on signal; every other moment, including
      the whole night, is manual 5. See binary_sensor.master_tv_on for why the Sonos
      soundbar state cannot be used for this.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.master_tv_on
        to: "on"
        id: tv_on
      - trigger: state
        entity_id: binary_sensor.master_tv_on
        to: "off"
        id: tv_off
      # One /5 pattern rather than /5 plus /30: two patterns would both fire on the
      # hour and half hour, and mode single would drop one with a spurious warning.
      - trigger: time_pattern
        minutes: /5
        id: reassert
    conditions:
      # Only the re-assert is rate-limited; a real TV transition always passes.
      - condition: template
        value_template: >-
          {{ trigger.id | default('') != 'reassert'
             or now().hour in [22, 23, 0]
             or now().minute % 30 == 0 }}
    actions:
      # unavailable/unknown deliberately matches neither branch: holding the last
      # known mode is the safe response to a missing TV signal, and manual 5 is
      # persistent so nothing decays while we wait.
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.master_tv_on
                state: "on"
            sequence:
              - action: rest_command.renew_quiet
                continue_on_error: true
          - conditions:
              - condition: state
                entity_id: binary_sensor.master_tv_on
                state: "off"
            sequence:
              - action: rest_command.renew_max
                continue_on_error: true
